 * 离开绿区 → 重新灰掉。削顶只警告不掐死。
 * 原则：专业易用——门槛只设在"必要"处，不设在"完美"处。绿区即合格，不考验用户耐心。
 * 返回 'ok' | 'back'。 */
function runLevelCalibOnce(M, token){
  return new Promise(function(resolve){
    var btPlay = app.playMode==='bt';
    var ov = document.createElement('div');
    ov.className = 'iso-overlay';
    ov.innerHTML =
      '<div class="iso-card">'+
        '<div class="h" style="font-size:17px;">'+escapeHtml(tt('measure.levelCalibTitle'))+'</div>'+
        '<div class="small mt8">'+escapeHtml(tt('measure.levelTargetGuide'))+'</div>'+
        '<div class="small" style="color:#8E8E93;">'+escapeHtml(tt('measure.levelTargetWhy'))+'</div>'+
        '<div class="small mt8" style="color:#8E8E93;">'+escapeHtml(tt(btPlay?'measure.levelCalibHint':'measure.levelCalibUsbHint'))+'</div>'+
        '<div id="lc-meter" style="position:relative;height:20px;border-radius:10px;overflow:hidden;margin:14px 0 4px;background:#1c1c1e;">'+
          '<div style="position:absolute;left:0%;width:30%;top:0;bottom:0;background:rgba(255,69,58,.40);"></div>'+
          '<div style="position:absolute;left:30%;width:20%;top:0;bottom:0;background:rgba(255,214,10,.40);"></div>'+
          '<div style="position:absolute;left:50%;width:20%;top:0;bottom:0;background:rgba(52,211,153,.55);"></div>'+
          '<div style="position:absolute;left:70%;width:10%;top:0;bottom:0;background:rgba(255,214,10,.40);"></div>'+
          '<div style="position:absolute;left:80%;width:20%;top:0;bottom:0;background:rgba(255,69,58,.50);"></div>'+
          '<div id="lc-needle" style="position:absolute;top:-2px;bottom:-2px;width:3px;margin-left:-1.5px;background:#fff;border-radius:2px;left:0%;box-shadow:0 0 4px rgba(255,255,255,.6);"></div>'+
        '</div>'+
        '<div class="small" style="position:relative;height:14px;margin-bottom:8px;color:#8E8E93;">'+
          '<span style="position:absolute;left:0;">-32</span>'+
          '<span style="position:absolute;left:30%;transform:translateX(-50%);">-20</span>'+
          '<span style="position:absolute;left:50%;transform:translateX(-50%);color:#34D399;">-12</span>'+
          '<span style="position:absolute;left:70%;transform:translateX(-50%);color:#34D399;">-4</span>'+
          '<span style="position:absolute;left:80%;transform:translateX(-50%);">0</span>'+
          '<span style="position:absolute;right:0;color:#636366;">+8</span>'+
        '</div>'+
        '<div class="small" id="lc-db" style="color:#8E8E93;">-- dBFS</div>'+
        '<div class="small mt8" id="lc-status" style="min-height:22px;"></div>'+
        '<div class="mt8"><button class="btn btn-primary" id="lc-go" disabled style="opacity:.4;">'+escapeHtml(tt('measure.levelGo'))+'</button></div>'+
        '<button class="btn btn-ghost" id="lc-back">'+escapeHtml(tt('measure.levelBack'))+'</button>'+
      '</div>';
    document.body.appendChild(ov);
    var done=false, timer=null;
    var analyser=null, timeBuf=null;
    try{ analyser=M.analyser; timeBuf=new Float32Array(M.fftSize||8192); }catch(_){}
    var smoothDb=-60, clipArmed=true;
    var needle=document.getElementById('lc-needle'),
        dbEl=document.getElementById('lc-db'),
        stEl=document.getElementById('lc-status'),
        goBtn=document.getElementById('lc-go');
    function zoneOf(db){
      // v2.9.10: 绿区 -12～-4dBFS（用户要求宽容度高一点；8dB 宽）。
      // 峰值 -12～-4 → RMS -24～-16dBFS；HFP 底噪 -37 时 SNR 13～21dB；离 0dBFS 有 4dB 削顶余量。

    function wire(id,val){

      el.addEventListener('touchstart',function(e){ var tc=e.touches[0]; sx=tc.clientX; sy=tc.clientY; },{passive:true});

        var tc=e.changedTouches[0];

      });

    var safeGain = 0.1;

async function levelCalibFlow(M, token){
  if(!M.analyser){ try{ console.warn('[levelCalib] no analyser, skip'); }catch(_){} track('levelcalib_skip'); return true; }
  for(;;){
    var r = await runLevelCalibOnce(M, token);
    if(token!==app.runToken) return false;
    if(r==='ok'){ track('levelcalib_ok'); return true; }
    if(r==='back'){ track('levelcalib_back'); return false; }
    track('levelcalib_retry');
  }
}
/* 无信号熔断：30s 全程没录到测试音——诚实报错，不产出垃圾报告。

/* floor 相位异常熔断：底噪阶段检测到持续播放信号，流程异常，不产数据 */
function failFloorAnomaly(token){
  if(token!==app.runToken) return;
  stopRaf(); app.measuring=false;
  try{ resetStepsUI(); }catch(_){} // v2.6 fix: 熔断后重置进度条/计时器，不留"假卡死"

/* 有效性门：不过则亮红字+回重试，不再继续 */
function validityGate(meas, chLabel){
  var vok = true, vreason='';
  try{
    var v = DSP.validityCheck(meas, S().floor31);
    if(v===false){ vok=false; }
    else if(v && typeof v==='object'){ vok = v.ok!==false; vreason = v.reason||''; }
  }catch(e){ vok=true; }
  if(!vok){
    var va = document.getElementById('valid-alert');
    va.textContent = tt('measure.validityFail') + (vreason?('：'+vreason):'');
    va.classList.add('show');
    track('measure_validity_fail', {ch:chLabel, reason:vreason});
    trackSecurity('measure_abnormal', {ch:chLabel, reason:(vreason||'').slice(0,80)}); // v2.9.40: 风控
    CTA.measure = [{ text: tt('common.retry'), onClick: startMeasureFlow }];
    renderCTA(CTA.measure);
    return false;
  }
  return true;
}
/* SNR 告警（<15dB 提示调大音量，不阻断；注：DSP.snr 签名为 (floor31, sig31)） */
function snrGate(meas, chLabel){
  try{
    var s = DSP.snr(S().floor31, meas);
    if(s && typeof s.db==='number' && s.pass===false){
      var sa = document.getElementById('snr-alert');
      sa.textContent = tt('measure.snrWarn') + '（' + s.db + ' dB）';
      sa.classList.add('show');
      track('measure_low_snr', {ch:chLabel, snr:s.db});
    }
  }catch(_){}
}
/* 测量主流程：由按钮 onclick 直接调用（iOS 手势链） */
/* v2.9.43: GPS 行车锁已移除（用户要求去掉所有 GPS 监测和弹窗）
 * 行车安全改为协议约束（v1.2 协议 3B）+ 首次安全须知弹窗提示
 */
async function startMeasureFlow(opts){
  // v2.9.35: 车型必选——没选车型（自定义也行）不让进测量页
  if(!S().car){
    try{
      var carSec = document.getElementById('sec-car');
      if(carSec){ show('car'); }
      var hint = document.getElementById('car-required-hint');
      if(!hint){
        hint = document.createElement('div');
        hint.id = 'car-required-hint';
        hint.className = 'alert yellow';
        hint.style.margin = '8px 0';
        hint.textContent = tt('car.requiredHint');
        var anchor = document.getElementById('car-manual-box');
        if(anchor && anchor.parentNode) anchor.parentNode.insertBefore(hint, anchor);
      } else { hint.classList.remove('hidden'); }
      try{ hint.scrollIntoView({behavior:'smooth', block:'center'}); }catch(_){}
    }catch(_){}
    return;
  }
  // v2.9.43: GPS 行车锁已移除，直接进测量
  var isRemeasure = !!(opts && opts.isRemeasure);
  app._remeasureMode = isRemeasure; // 复测失败/削顶时重试仍走复测入口
  hideAlerts();
  document.getElementById('mic-err-card').classList.add('hidden');
  resetStepsUI();
  var token = ++app.runToken;
  // v2.9.13: 防旧探针/试音的粉噪漏进新测量的底噪阶段——先停掉老 Measurer 的一切播放
  try{ if(app.measurer){ app.measurer.stopPink(0.1); } }catch(_){}
  var spec = S().eqSpec;
  // ① 音频初始化（必须在手势回调链内同步触发；只建 AudioContext，不碰麦克风——试音要干净会话）
  var M;
  try{
    M = new DSP.Measurer();
    M._btPlay = (app.playMode==='bt'); // v2.6 fix: 试音 playPink 在 measureMerged 之前调用，此时 _btPlay 未设置会导致满幅播放炸音箱。提前设置。
    await M.initAudio();       // ← iOS：AudioContext 在此完成；麦克风等试音通过后再开
  }catch(e){
    document.getElementById('mic-err-card').classList.remove('hidden');
    document.getElementById('mic-err-title').textContent = ttx('measure.micErrTitle','measure.validityFail');
    document.getElementById('mic-err-body').textContent = ttx('measure.micErrBody','measure.safeNote');
    track('measure_mic_denied', {remeasure:!!app._remeasureMode});
    CTA.measure = [{ text: tt('common.retry'), onClick: retryMeasureFn() }];
    renderCTA(CTA.measure);
    return;
  }
  if(token!==app.runToken) return;
  app.measurer = M;
  try{ M.setEqSpec(spec); }catch(_){}
  track('measure_start', {mode:app.playMode, bands:spec?spec.bands:0});
  CTA.measure = [{ text: tt('measure.measuringTip'), disabled:true, onClick:function(){} }];
  renderCTA(CTA.measure);

  // ② 试音（仅蓝牙模式）：3s 粉噪 → 确认能出声 → 不通过则排查指引
  // v2.6: 只做连通性确认（"听得到吗"），音量确认移到麦克风激活后——
  // iOS 在 initMic 时切换音频会话会改变蓝牙音量，试音音量≠正式测试音量。
  // 在 initMic 之前做连通性：麦克风未激活＝干净的播放会话，蓝牙 A2DP 最稳定
  if(app.playMode==='bt'){
    var _scOK = await soundCheckFlow(M, token, true); // connectivityOnly=true
    if(token!==app.runToken) return;
    if(!_scOK){
      setStatus('');
      CTA.measure = [{ text: tt('measure.ctaStart'), onClick: startMeasureFlow }];
      renderCTA(CTA.measure);
      return;
    }
  }
  if(token!==app.runToken) return;

  // ③ 激活麦克风（连通性通过后）
  try{
    await M.initMic();
  }catch(e){
    document.getElementById('mic-err-card').classList.remove('hidden');
    document.getElementById('mic-err-title').textContent = ttx('measure.micErrTitle','measure.validityFail');
    document.getElementById('mic-err-body').textContent = ttx('measure.micErrBody','measure.safeNote');
    track('measure_mic_denied', {remeasure:!!app._remeasureMode});
    CTA.measure = [{ text: tt('common.retry'), onClick: retryMeasureFn() }];
    renderCTA(CTA.measure);
    return;
  }
  if(token!==app.runToken) return;

  // ③b 电平调节（v2.9.24 手动滑杆）：每次正式测试前都让用户确认电平（用户要求）。
  // v2.9.36: 去掉 playMode==='bt' 门——刷新/复测时 playMode 丢失会导致滑杆被跳过。
  {
    var _vcOK = await autoGainFlow(M, token);
    if(token!==app.runToken) return;
    if(!_vcOK){
      setStatus('');
      CTA.measure = [{ text: tt('measure.ctaStart'), onClick: startMeasureFlow }];
      renderCTA(CTA.measure);
      return;
    }
  }
  if(token!==app.runToken) return;

  // ④ 30s 合并测量：底噪 5s → 立体声 25s，一次跑完无停顿
  CTA.measure = [{ text: tt('measure.measuringTip'), disabled:true, onClick:function(){} }];
  renderCTA(CTA.measure);
  app.measureMode = 'stereo'; buildStepsUI();
  setStepState(0,'active');
  app.curStep=0; app.stepStart=performance.now(); app.stepDur=30; app._pauseAccum=0; app._uiPauseStart=0;
  app.frameCount=0; app.avgShown=false; app._shownFrames=-1; app.clipStreak=0; app.lowStreak=0;
  stepStartUI(0);
  startRaf();
  // v2.9.43: GPS 持续监控已移除
  var res = null;
  try{
    res = await M.measureMerged({
      btPlay: app.playMode==='bt',
      phases: PHASES_STEREO,
      onFrame: function(ph, info){ onFrame(info); },
      onPhase: function(phKey, ph){ setOverallObj(liveStatusFor(ph.obj)); }
    });
  }catch(e){ return failMeasure(token, e); }
  if(token!==app.runToken) return; // 削顶自动停止后丢弃
  stopRaf(); app.measuring=false;
  // v2.9.43: GPS 监控已移除，无需停止
  if(res && res.noSignal){ return failNoSignal(token); }
  if(res && res.floorAnomaly){ return failFloorAnomaly(token); }
  var floor31 = res.floor31, meas = res.seg31.sig;
  S().floor31 = floor31;
  if(!validityGate(meas, 'stereo')) return;
  snrGate(meas, 'stereo');
  S().measL = meas; S().measR = meas;
  S().channelIsolated = false;
  setStepState(0,'done');
  // 收尾："已完成监听"＋停 1 秒让用户看到（用户指定文案）
  setStatus(tt('measure.listenDone'));
  setOverallObj(tt('measure.listenDone'));
  setOverallFill(1);
  track('measure_done', {flow:'merged30'});
  await new Promise(function(r){ setTimeout(r, 1000); });
  if(token!==app.runToken) return;
  if(isRemeasure){
    // 复测：不覆盖调前数据，不写主测量存档，路由到复测对比（复测同样走 30s 合并流程）
    setStatus('');
    track('measure_done', {flow:'merged30', remeasure:true});
    finishRemeasure(meas);
    return;
  }
  // 持久化（经 DSP）
  // v2.9.3: 先亮"正在生成"防假死；saveMeasurement/renderCTA 都在 try/catch，任何一步抛异常都不白屏
  setStatusSpin(tt('measure.generatingPlan'));
  try{ DSP.saveMeasurement({ car:S().car, eqSpec:S().eqSpec, floor31:floor31, measL:meas, measR:meas, channelIsolated:false, mode:app.playMode, ts:Date.now() }); }catch(e){ console.error('[measure] saveMeasurement failed', e); }
  setStatus('');
  try{ renderCTA(CTA['measure_done']); }catch(e){
    console.error('[measure] renderCTA failed', e);
    // 兜底：直接进报告页，不让用户卡在 100%
    try{ renderReport(); show('report'); }catch(_){}
  }
}

/* 进阶：声道隔离自检 → 解锁 L/R 独立测量（DSP/外接播放器用户）。
   车机 DSP 会对蓝牙/USB 输入混音/上混，大多数车机过不了自检——这是硬件链路限制。 */
async function startLrOptIn(){

    setStatus('');
    track('lr_optin_iso_fail');
    renderCTA(CTA['measure_done']);
    return;
  }
  track('lr_optin_iso_pass');

  // 30s 合并 L/R：底噪 5s＋左 12.5s＋右 12.5s，一次跑完（相位切换处 fade 过渡，无爆音）
  setStepState(0,'active');
  app.curStep=0; app.stepStart=performance.now(); app.stepDur=30; app._pauseAccum=0; app._uiPauseStart=0;
  app.frameCount=0; app.avgShown=false; app._shownFrames=-1; app.clipStreak=0; app.lowStreak=0;
  stepStartUI(0);
  startRaf();
  var res = null;
  try{
    res = await M.measureMerged({
      btPlay: app.playMode==='bt',
      phases: PHASES_LR,
      onFrame: function(ph, info){ onFrame(info); },
      onPhase: function(phKey, ph){ setOverallObj(liveStatusFor(ph.obj)); }
    });
  }catch(e){ return failMeasure(token, e); }
  if(token!==app.runToken) return;
  stopRaf(); app.measuring=false;
  if(res && res.noSignal){ return failNoSignal(token); }
  if(res && res.floorAnomaly){ return failFloorAnomaly(token); }
  S().floor31 = res.floor31;
  var L31 = res.seg31.L, R31 = res.seg31.R;
  if(!validityGate(L31, 'L')) return;

  snrGate(L31, 'L'); snrGate(R31, 'R');

  setStepState(0,'done');

  setOverallFill(1);

  await new Promise(function(r){ setTimeout(r, 1000); });
  if(token!==app.runToken) return;
  setStatus('');
  try{ renderCTA(CTA['measure_done']); }catch(e){
    console.error('[measure] renderCTA failed', e);

/* =====================================================================
 * 免费报告
 * ===================================================================== */
function avg31(){
  var L=S().measL, R=S().measR;
  var a = (L&&L.band31)||L||[], b=(R&&R.band31)||R||[];
  var n = Math.max(a.length,b.length,31), out=[];
  for(var i=0;i<n;i++){
    var x = (typeof a[i]==='number')?a[i]:0, y=(typeof b[i]==='number')?b[i]:0;
    out.push((x+y)/2);
  }
  return out;
}
/* 规则引擎层（v1）：数值方案由 DSP.ruleEngine 产生；LLM 文案层为 v2 预留 */
function buildPlan(){
  // v2.9.34: eqSpec 为空时默认 7 段（用户没选车型时也出方案，不再空白）
  var spec = S().eqSpec;
  if(!spec || !spec.bands){
    spec = { bands: 7, labels: null, centers: null, rangeDb: 9, stepDb: 1 };
  }
  var result = DSP.ruleEngine(S().measL, S().measR, spec, { channelIsolated: S().channelIsolated, floor31: S().floor31 });
  // v2.9.51: ruleEngine 返回 bandsCombined，renderPlan 取 plan.bands——字段名对齐
  if(result && !result.bands && result.bandsCombined){
    result.bands = result.bandsCombined;
  }
  return result;
}

/* v2-C: diag+peq JS */
/* =====================================================================
 * v2-C 深度诊断（规则引擎成因分析，零 LLM）：
 *   纯 if/then 确定性规则；每条只说成因 + 现有硬件下的处理，
 *   只做成因分析 + 现有硬件下的处理，不做任何硬件改动推荐（铁律）。
 * ===================================================================== */
/* 实测均值与目标偏差（31 段）：诊断与 PEQ 共用 */
function diagDeviation(){
  var iso = DSP.ISO31 || [];
  var meas = avg31();
  var tgt = [], dev = [], i;
  for(i=0;i<31;i++){
    var f = iso[i] || 0;
    var t = 0;
    try{ t = DSP.targetDbAt(f); }catch(_){}
    tgt.push(t);
    dev.push((meas[i]||0) - t);
  }
  return { iso: iso, meas: meas, tgt: tgt, dev: dev };
}
/* 确定性诊断规则集，返回 [{title, cause}]（文案走 COPY） */
function runDiag(){
  var d = diagDeviation(), iso = d.iso, dev = d.dev;
  var out = [], i, k;
  // 规则 1：驻波/房间模式 —— 50-200Hz 内连续 2 个以上 1/3 倍频程点偏离 >+6dB
  var rs = -1;
  for(k=0;k<=31;k++){
    var on = (k<31) && iso[k]>=50 && iso[k]<=200 && dev[k]>6;
    if(on){ if(rs<0) rs=k; }
    else { if(rs>=0 && k-rs>=2) out.push({t:'standing', a:rs, b:k-1}); rs=-1; }
  }
  // 规则 2：梳状滤波 —— 相邻频点交替 +/- 超过 4dB、持续 3 组以上（即 >=4 个交替 bin）
  var j = 0;
  while(j<31){
    var idxs=[], signs=[], m=j;
    while(m<31){
      var ad = Math.abs(dev[m]);
      if(ad<=4) break;
      var sg = dev[m]>0 ? 1 : -1;
      if(signs.length && sg===signs[signs.length-1]) break;
      signs.push(sg); idxs.push(m); m++;
    }
    if(idxs.length>=4){ out.push({t:'comb', a:idxs[0], b:idxs[idxs.length-1]}); j=idxs[idxs.length-1]; }
    else j++;
  }
  // 规则 3：低频滚降 —— <60Hz 持续低于目标 >4dB
  var lowAll = true, lowN = 0;
  for(i=0;i<31;i++){ if(iso[i]<60){ lowN++; if(dev[i]>=-4) lowAll=false; } }
  if(lowN>0 && lowAll) out.push({t:'rolloff'});
  // 规则 4：声场失衡 —— 有 L/R 独立数据且 max|L-R|>6dB
  if(S().channelIsolated===true){
    var L = (S().measL && S().measL.band31) || S().measL || [];
    var R = (S().measR && S().measR.band31) || S().measR || [];
    var maxD = 0;
    for(i=0;i<31;i++){ var dd = Math.abs((L[i]||0)-(R[i]||0)); if(dd>maxD) maxD=dd; }
    if(maxD>6) out.push({t:'imbalance', x:Math.round(maxD*10)/10});
  }
  // 文案装配
  var res = [];
  out.forEach(function(it){
    if(it.t==='standing' || it.t==='comb'){
      var rg = (it.a===it.b) ? String(iso[it.a]) : (String(iso[it.a])+'–'+String(iso[it.b]));
      if(it.t==='standing') res.push({title: tf('diag.standing')(rg), cause: tt('diag.standingCause')});
      else res.push({title: tf('diag.comb')(rg), cause: tt('diag.combCause')});
    }else if(it.t==='rolloff'){
      res.push({title: tt('diag.rolloff'), cause: tt('diag.rolloffCause')});
    }else if(it.t==='imbalance'){
      res.push({title: tf('diag.imbalance')(String(it.x)), cause: tt('diag.imbalanceCause')});
    }
  });
  return res;
}
function renderDiag(){
  setText('diag-title','diag.title');
  var box = document.getElementById('diag-list');
  box.innerHTML = '';
  var items = runDiag();
  if(!items.length){
    var s = document.createElement('div');
    s.className = 'small'; s.style.color = 'var(--sub)';
    s.textContent = tt('diag.none');
    box.appendChild(s);
    return;
  }
  items.forEach(function(it){
    var c = document.createElement('div');
    c.className = 'card';
    c.innerHTML = '<div class="body14" style="font-weight:600;">'+escapeHtml(it.title)+'</div>'+
      '<div class="small mt8" style="color:var(--sub);">'+escapeHtml(tt('diag.causeTag'))+escapeHtml(it.cause)+'</div>';
    box.appendChild(c);
  });
}

/* =====================================================================
 * v2-C: DSP PEQ 参数输出
 * 简化算法：基于 31 段残差，取残差最大的 N 个频点（N<=8），逐个输出
 * freq/gain/Q。Q 为简化映射（|gain|>=6dB->2.0，3-6dB->1.4，<3dB->1.0，
 * 详见 peq.qNote）；gain 遵守 cut-only 只出负增益；需要提升的频点只显示
 * "建议不提升"，不输出正 PEQ。底噪污染频段（SNR<10dB）跳过。
 * ===================================================================== */
function buildPeqParams(){
  var dd = diagDeviation(), iso = dd.iso, dev = dd.dev;
  var floor31 = S().floor31;
  var cands = [], i;
  for(i=0;i<31;i++){
    var a = Math.abs(dev[i]);
    if(a<1) continue; // 残差过小不出参数
    if(floor31){
      var snr = (dd.meas[i]||0) - (floor31[i]||0);
      if(snr<10) continue; // 底噪污染频段跳过
    }
    cands.push({i:i, f:iso[i], dev:dev[i]});
  }
  cands.sort(function(x,y){ return Math.abs(y.dev)-Math.abs(x.dev); });
  cands = cands.slice(0,8);
  cands.sort(function(x,y){ return x.f-y.f; }); // 按频率升序，方便逐条设置
  return cands.map(function(c){
    if(c.dev>0.5){
      var g = -Math.round(c.dev*2)/2; // 0.5dB 步进取整（cut-only：恒为负）
      var ag = Math.abs(g);
      var q = ag>=6 ? 2.0 : (ag>=3 ? 1.4 : 1.0); // 简化映射
      return {freq:c.f, gain:g, q:q, boost:false};
    }
    return {freq:c.f, gain:null, q:null, boost:true}; // 凹陷：只标注建议不提升
  });
}
function renderPeq(){
  var tg = document.getElementById('peq-toggle');
  tg.innerHTML = '<span id="peq-arrow">▶</span> '+escapeHtml(tt('peq.title'));
  setText('peq-note','peq.hint');
  setText('peq-th-f','peq.colFreq');
  setText('peq-th-g','peq.colGain');
  setText('peq-th-q','peq.colQ');
  setText('peq-qnote','peq.qNote');
  setText('peq-copy','peq.copyBtn');
  var rows = buildPeqParams();
  var table = document.getElementById('peq-table');
  var tb = document.getElementById('peq-tbody');
  tb.innerHTML = '';
  var empty = document.getElementById('peq-empty');
  if(!rows.length){
    table.style.display = 'none';
    empty.style.display = '';
    empty.textContent = tt('peq.empty');
  }else{
    table.style.display = '';
    empty.style.display = 'none';
    rows.forEach(function(r){
      var tr = document.createElement('tr');
      var gtxt = r.boost ? tt('peq.noBoost') : (String(r.gain)+'dB');
      var qtxt = r.boost ? '—' : r.q.toFixed(1);
      tr.innerHTML = '<td class="num">'+escapeHtml(String(r.freq))+'</td>'+
        '<td class="num">'+escapeHtml(gtxt)+'</td>'+
        '<td class="num">'+escapeHtml(qtxt)+'</td>';
      tb.appendChild(tr);
    });
  }
  var copied = document.getElementById('peq-copied');
  copied.style.display = 'none';
  document.getElementById('peq-copy').onclick = function(){ copyPeq(rows); };
  tg.onclick = function(){
    var body = document.getElementById('peq-body');
    var nowHidden = body.classList.toggle('hidden'); // true=收起
    document.getElementById('peq-arrow').textContent = nowHidden ? '▶' : '▼';
    track('peq_toggle', {open:!nowHidden});
  };
}
function copyPeq(rows){
  var TAB = String.fromCharCode(9), LF = String.fromCharCode(10); // 制表符 / 换行（ES5 无模板字面量）
  var lines = [tt('peq.colFreq')+TAB+tt('peq.colGain')+TAB+tt('peq.colQ')];
  rows.forEach(function(r){
    var gtxt = r.boost ? tt('peq.noBoost') : (String(r.gain)+'dB');
    var qtxt = r.boost ? '—' : r.q.toFixed(1);
    lines.push(String(r.freq)+TAB+gtxt+TAB+qtxt);
  });
  var txt = lines.join(LF);
  var done = function(ok){
    var el = document.getElementById('peq-copied');
    el.textContent = tt(ok?'peq.copyOk':'peq.copyFail');
    el.style.display = '';
    track('peq_copy',{ok:!!ok});
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(String(txt)).then(function(){done(true);},function(){done(false);});
  }else{
    var ta = document.createElement('textarea');
    ta.value = String(txt);
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand('copy'); done(true); }catch(_){ done(false); }
    document.body.removeChild(ta);
  }
}
function drawReportChart(){
  var cv = document.getElementById('report-chart');
  var g = fitCanvas(cv, 220), ctx=g.ctx, W=g.w, H=g.h;
  ctx.clearRect(0,0,W,H);
  var iso = DSP.ISO31 || [];
  var meas = avg31();
  var tgt = iso.map(function(f){ try{ return DSP.targetDbAt(f); }catch(_){ return 0; } });
  var sim = meas.slice();
  try{
    var draft = S()._planDraft || buildPlan();
    var gains = (draft.bands||[]).map(function(bd){ return bd.gainDb||0; });
    sim = DSP.simulate(meas, gains) || meas;
  }catch(_){}
  var all = meas.concat(tgt, sim);
  var mn=Math.min.apply(null,all)-2, mx=Math.max.apply(null,all)+2;
  function X(f){ var l0=Math.log10(20), l1=Math.log10(20000); return 34+(Math.log10(f)-l0)/(l1-l0)*(W-44); }
  function Y(db){ return 14+(1-(db-mn)/(mx-mn))*(H-38); }
  // 网格
  ctx.strokeStyle='rgba(255,255,255,.06)'; ctx.lineWidth=1;
  [20,50,100,200,500,1000,2000,5000,10000,20000].forEach(function(f){
    ctx.beginPath(); ctx.moveTo(X(f),14); ctx.lineTo(X(f),H-24); ctx.stroke();
    ctx.fillStyle='#5b6472'; ctx.font='9px sans-serif'; ctx.textAlign='center';
    ctx.fillText(f>=1000?(f/1000)+'k':f, X(f), H-10);
  });
  function line(arr, color, width){
    ctx.strokeStyle=color; ctx.lineWidth=width; ctx.beginPath();
    for(var i=0;i<iso.length && i<arr.length;i++){
      var x=X(iso[i]), y=Y(arr[i]);
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  line(tgt,'#FF9F1C',2);   // 目标曲线
  line(meas,'#22D3EE',2);  // 实测均值
  line(sim,'#34D399',1.5); // 模拟调后
  // v2-PATCH-01 (V2P01-UI-CHART)：多选风格对比线（已应用风格即橙色目标线，不重复画）
  try{
    var _csSel = app.styleSel || [];
    var _csApplied = _csSel.length ? _csSel[_csSel.length-1] : null;
    for(var _ci=0; _ci<_csSel.length; _ci++){
      var _ck = _csSel[_ci];
      if(_ck===_csApplied) continue;
      var _carr = DSP.styleTarget31(_ck);
      if(_carr) line(_carr, STYLE_LINE_COLORS[_ck] || '#94a3b8', 1);
    }
  }catch(_){}
}

/* [v2-workerD-sharecard] v1: 分享报告卡 */
function shareCardFlatScore(){
  try{
    var iso = DSP.ISO31 || [], m = avg31(), sum = 0, n = 0;
    for(var i = 0; i < iso.length && i < m.length; i++){
      var tg = DSP.targetDbAt(iso[i]);
      if(isFinite(tg) && isFinite(m[i])){ sum += Math.abs(m[i] - tg); n++; }
    }
    if(!n) return 0;
    return Math.max(0, Math.min(100, Math.round(100 - (sum / n) * 10)));
  }catch(_){ return 0; }
}
function shareCardIssues(){
  try{
    var prev = buildPlan();
    var bands = prev.bands || prev || [];
    return bands.filter(function(bd){ return Math.abs(bd.gainDb || 0) >= 1 || bd.comb || bd.unfixable; }).length;
  }catch(_){ return 0; }
}

function buildShareCard(){
  var W = 750, H = 1334;
  var cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  var c = cv.getContext('2d');
  // 背景：深蓝/黑渐变
  var bg = c.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#101a2b'); bg.addColorStop(0.55, '#0b1220'); bg.addColorStop(1, '#070c15');
  c.fillStyle = bg; c.fillRect(0, 0, W, H);
  // 顶部细青色装饰线
  c.fillStyle = '#22D3EE'; c.fillRect(0, 0, W, 6);

  var car = S() && S().car;
  var carName = car ? [car.brand, car.series, car.year].filter(function(x){ return !!x; }).join(' ') : '';
  // 顶部：车型 + 标题 + 内测 badge
  shareCardText(c, carName || '—', W / 2, 92, 30, '#9aa4b2');
  shareCardText(c, tt('share.title'), W / 2, 168, 56, '#ffffff', true);
  c.strokeStyle = 'rgba(255,159,28,.8)'; c.lineWidth = 2;
  var bw = 150, bx = W - bw - 56, by = 52;
  c.beginPath();
  if(c.roundRect){ c.roundRect(bx, by, bw, 44, 22); } else { c.rect(bx, by, bw, 44); }
  c.stroke();
  shareCardText(c, tt('share.beta'), bx + bw / 2, by + 23, 24, '#FF9F1C');
  // 分隔线
  c.strokeStyle = 'rgba(255,255,255,.10)'; c.lineWidth = 1;
  c.beginPath(); c.moveTo(56, 246); c.lineTo(W - 56, 246); c.stroke();

  // 中部：测量 vs 目标 双线图
  shareCardText(c, tt('share.measLine') + '  /  ' + tt('share.targetLine'), W / 2, 296, 26, '#9aa4b2');
  var iso = DSP.ISO31 || [], meas = avg31();
  var tgt = iso.map(function(f){ try{ return DSP.targetDbAt(f); }catch(_){ return 0; } });
  var all = meas.concat(tgt);
  var mn = Math.min.apply(null, all) - 2, mx = Math.max.apply(null, all) + 2;
  var px0 = 64, px1 = W - 64, py0 = 380, py1 = 700;
  function X(f){ var l0 = Math.log10(20), l1 = Math.log10(20000); return px0 + (Math.log10(f) - l0) / (l1 - l0) * (px1 - px0); }
  function Y(db){ return py0 + (1 - (db - mn) / (mx - mn)) * (py1 - py0); }
  c.strokeStyle = 'rgba(255,255,255,.08)'; c.lineWidth = 1;
  [20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000].forEach(function(f){
    c.beginPath(); c.moveTo(X(f), py0); c.lineTo(X(f), py1); c.stroke();
    shareCardText(c, f >= 1000 ? (f / 1000) + 'k' : String(f), X(f), py1 + 28, 20, '#5b6472');
  });
  function line2(arr, color, width){
    c.strokeStyle = color; c.lineWidth = width; c.beginPath();
    for(var i = 0; i < iso.length && i < arr.length; i++){
      var x = X(iso[i]), y = Y(arr[i]);
      if(i === 0) c.moveTo(x, y); else c.lineTo(x, y);
    }
    c.stroke();
  }
  line2(tgt, '#FF9F1C', 3);
  line2(meas, '#22D3EE', 4);
  // 图例
  var ly = py1 + 72;
  c.fillStyle = '#22D3EE'; c.fillRect(W / 2 - 190, ly - 5, 40, 8);
  shareCardText(c, tt('share.measLine'), W / 2 - 105, ly, 24, '#c7d0dd', false, 'left');
  c.fillStyle = '#FF9F1C'; c.fillRect(W / 2 + 60, ly - 5, 40, 8);
  shareCardText(c, tt('share.targetLine'), W / 2 + 145, ly, 24, '#c7d0dd', false, 'left');

  // 数据行
  var score = shareCardFlatScore(), issues = shareCardIssues();
  var dy = 920;
  shareCardText(c, String(score), W / 2, dy, 120, '#22D3EE', true);
  shareCardText(c, tt('share.scoreLabel'), W / 2, dy + 92, 30, '#9aa4b2');
  var row = tf('share.issuesN')(issues) + '  ·  ' + tt('share.curveLabel') + '：' + shareCardCurveName() +
            '  ·  ' + tt('share.styleLabel') + '：' + shareCardStyleName();
  shareCardText(c, row, W / 2, dy + 148, 26, '#c7d0dd');

  // 底部：slogan + 二维码占位框
  shareCardText(c, tt('share.slogan'), W / 2, 1080, 38, '#ffffff', true);
  var qs = 200, qx = W / 2 - qs / 2, qy = 1130;
  c.strokeStyle = 'rgba(255,255,255,.25)'; c.lineWidth = 2;
  c.beginPath();
  if(c.roundRect){ c.roundRect(qx, qy, qs, qs, 16); } else { c.rect(qx, qy, qs, qs); }
  c.stroke();
  shareCardText(c, tt('share.qrText'), W / 2, qy + qs / 2, 26, '#9aa4b2');

  return cv;
}

/* 频段中文名（v2.9.6）：bd.label 缺失时的兜底。
 * 命名来源：用户星越L 7 段车机实测（重低音/低音/中低音/中音/中高音/高音/超高音），
 * 3/5 段为同体系简化版。En 数组预留（当前中文单语，无语言切换逻辑）。 */
var BAND_LABELS_CN = {
  3: ['低音','中音','高音'],
  5: ['低音','中低音','中音','中高音','高音'],
  7: ['重低音','低音','中低音','中音','中高音','高音','超高音']
};
var BAND_LABELS_EN = {
  3: ['Bass','Mid','Treble'],
  5: ['Bass','Low-mid','Mid','High-mid','Treble'],
  7: ['Sub-bass','Bass','Low-mid','Mid','High-mid','Treble','Super-treble']
};
function bandLabel(i, nBands, en){
  var arr = (en ? BAND_LABELS_EN : BAND_LABELS_CN)[nBands];
  if(arr && arr[i]) return arr[i];
  return 'B'+(i+1);
}
function renderPlan(){
  setText('bk-plan','common.back');
  // v2.9.3: 每次渲染先藏起错误卡，成功路径才显示正常内容
  document.getElementById('plan-error').classList.add('hidden');
  var spec = S().eqSpec;
  var isET9 = !spec || spec.bands===0;
  document.getElementById('plan-normal').classList.toggle('hidden', isET9);
  document.getElementById('plan-et9').classList.toggle('hidden', !isET9);
  if(isET9){
    setText('plan-et9t','plan.et9Title');
    setText('plan-et9b','plan.et9Body');
    CTA.plan = [{ text: tt('plan.doneBtn'), onClick:function(){ show('home'); } }];
    renderCTA(CTA.plan);
    track('plan_view_et9');
    return;
  }
  setText('plan-title','plan.title');
  setText('plan-sub','plan.sub');
  (function(){
    var el = document.getElementById('plan-perband');
    if(el && spec) el.textContent = tt('plan.perBandNote').split('{n}').join(spec.bands);
  })();
  setText('plan-burnt','plan.burnTitle');
  setText('plan-burnb','plan.burnBody');
  setText('plan-restoret','plan.restoreTitle');
  setText('plan-avgnote','plan.avgNote');
  var rs = t('plan.restoreSteps');
  var rul = document.getElementById('plan-restoresteps'); rul.innerHTML='';
  (Array.isArray(rs)?rs:[]).forEach(function(s){ var li=document.createElement('li'); li.textContent=s; rul.appendChild(li); });

  var plan = S()._planDraft;
  // v2.9.3: buildPlan 抛异常不再静默吞（此前 catch 后 plan={bands:[]} → 空白页，用户以为"方案出不来"）。
  // 主因：S().measL 为空（页面刷新/状态丢失）。失败时打埋点＋人话红字卡＋返回重测按钮。
  if(!plan){
    // v2.9.48: 诊断信息直接显示在错误页（iPhone 无 console）
    var _diag = '';
    try{
      _diag = 'measL:' + (S().measL ? 'OK(' + (S().measL.length||'?') + ')' : 'NULL') +
              ' measR:' + (S().measR ? 'OK' : 'NULL') +
              ' floor:' + (S().floor31 ? 'OK' : 'NULL') +
              ' spec:' + (S().eqSpec ? 'OK' : 'NULL');
      trackSecurity('plan_diag', {
        measL: !!S().measL, measR: !!S().measR, floor31: !!S().floor31,
        eqSpec: !!S().eqSpec, car: !!(S().car && (S().car.id || S().car.name))
      });
    }catch(_){ _diag = 'diag-fail'; }
    try{ plan = buildPlan(); S()._planDraft = plan; }
    catch(e){
      try{ track('plan_build_fail', {err:String(e&&e.message||e).slice(0,100)}); }catch(_){}
      console.error('[renderPlan] buildPlan failed', e, _diag);
      document.getElementById('plan-normal').classList.add('hidden');
      document.getElementById('plan-et9').classList.add('hidden');
      document.getElementById('plan-error').classList.remove('hidden');
      setText('plan-errt','plan.errTitle');
      // v2.9.48: 错误页追加诊断码，方便定位
      try{
        document.getElementById('plan-errb').innerHTML = tt('plan.errBody') + '<br><br><span style="font-size:11px;color:#666;">诊断码：' + _diag + '｜' + String(e&&e.message||e).slice(0,60) + '</span>';
      }catch(_){ setText('plan-errb','plan.errBody'); }
      setText('plan-err-retry','plan.errRetry');
      document.getElementById('plan-err-retry').onclick = function(){ show('measure'); };
      CTA.plan = [];
      renderCTA(CTA.plan);
      return;
    }
  }
  S().plan = plan;
  // v2.9.44: 调优计数——每次成功生成方案 +1（同一车型重复调优也计数）
  try{
    var _tc = parseInt(localStorage.getItem('ct_tune_count')||'0', 10)||0;
    localStorage.setItem('ct_tune_count', String(_tc+1));
    trackSecurity('tune_complete', {count: _tc+1});
  }catch(_){}
  var bands = plan.bands||[];
  // v2.9.30: bands 为空也算失败（之前只处理 throw，空数组会静默空白页）
  if(bands.length === 0){
    try{ track('plan_build_empty', {}); }catch(_){}
    console.error('[renderPlan] buildPlan returned empty bands');
    document.getElementById('plan-normal').classList.add('hidden');
    document.getElementById('plan-et9').classList.add('hidden');
    document.getElementById('plan-error').classList.remove('hidden');
    setText('plan-errt','plan.errTitle');
    setText('plan-errb','plan.errBody');
    setText('plan-err-retry','plan.errRetry');
    document.getElementById('plan-err-retry').onclick = function(){ show('measure'); };
    CTA.plan = [];
    renderCTA(CTA.plan);
    return;
  }
  // 梳状谷检测（规则引擎层 v1 标注）
  var combIdx = [];
  try{ combIdx = DSP.detectComb(avg31()) || []; }catch(_){}
  var box = document.getElementById('plan-bands'); box.innerHTML='';
  var _nBands = (spec && spec.bands) || bands.length || 7;
  bands.forEach(function(bd, i){
    var dispLabel = bd.label || bandLabel(i, _nBands, false);
    var card = document.createElement('div');
    var isComb = !!bd.comb || combIdx.indexOf(i)>=0;
    card.className = 'gaincard' + (isComb?' comb':'') + ((bd.gainDb||0)>0.5?' boost':'');
    // 中心频率未知时显示"经验预设"
    var centerTxt = (spec.centersVerified && bd.centerHz!=null) ? (bd.centerHz+' Hz') : tt('car.centersPending');
    var gv = (bd.gainDb>0?'+':'') + (bd.gainDb||0) + 'dB';
    // 分频段 SNR 状态点：绿可信 / 黄轻度污染 / 灰未出方案
    var snrState = bd.snr||'ok';
    var snrDot = snrState==='warn'
      ? '<span class="snrdot" style="background:var(--amber);" title="'+escapeHtml(tt('plan.snrWarn'))+'"></span>'
      : snrState==='bad'
      ? '<span class="snrdot" style="background:#8a94a6;" title="'+escapeHtml(tt('plan.snrBad'))+'"></span>'
      : '<span class="snrdot" style="background:var(--green);"></span>';
    var unfix = '';
    if(bd.unfixable){
      unfix = '<div class="gc" style="color:var(--amber);">需要 '+(bd.unfixable.needDb||bd.unfixable.need)+
              '，车机只能到 '+(bd.unfixable.maxDb||bd.unfixable.max)+'（如实告知：此段无法完全修正）</div>';
    }
    card.innerHTML =
      '<div class="gl"><div class="gt">'+escapeHtml(dispLabel)+snrDot+
        (isComb?' <span class="tag" style="color:var(--red);border-color:rgba(255,77,77,.5);">梳状谷</span>':'')+'</div>'+
        '<div class="gc num">'+escapeHtml(centerTxt)+(bd.action?' · '+escapeHtml(String(bd.action)):'')+'</div>'+
        (isComb?'<div class="gc" style="color:var(--red);">'+escapeHtml(tt('plan.combNote'))+'</div>':'')+
        unfix+'</div>'+
      '<div class="gv num">'+escapeHtml(gv)+'</div>';
    box.appendChild(card);
  });
  // 分频段 SNR 图例（一句话）
  var snrLegend = document.createElement('div');
  snrLegend.className = 'small';
  snrLegend.style.cssText = 'margin:2px 0 12px;';
  snrLegend.innerHTML =
    '<span class="snrdot" style="background:var(--green);margin-left:0;"></span> 可信　' +
    '<span class="snrdot" style="background:var(--amber);margin-left:0;"></span> ' + escapeHtml(tt('plan.snrWarn')) + '（增益供参考）　' +
    '<span class="snrdot" style="background:#8a94a6;margin-left:0;"></span> ' + escapeHtml(tt('plan.snrBad'));
  box.appendChild(snrLegend);
  try{ DSP.savePlan(plan); }catch(_){}
  track('plan_view', {bands:bands.length});
  CTA.plan = [
    { text: tt('remeasure.btn'), onClick: startRemeasurePrompt },
    { text: tt('plan.saveCardBtn'), primary:false, onClick: saveShareCard },
    { text: tt('plan.doneBtn'), primary:false, onClick:function(){ show('home'); } }
  ];
  renderCTA(CTA.plan);
}
/* 保存成绩单：生成分享卡片 DOM + 复制分享文案（禁诱导话术，文案走 COPY） */
function saveShareCard(){
  var card = document.getElementById('share-card');
  var car = S().car, carName = car ? [car.brand,car.series,car.year].filter(Boolean).join(' ') : '';
  var plan = S().plan||{bands:[]};
  var _scBands = (plan.bands||[]).length || 7;
  var gains = (plan.bands||[]).map(function(bd, bi){ return (bd.label||bandLabel(bi,_scBands,false))+((bd.gainDb>0?'+':'')+(bd.gainDb||0)+'dB'); }).join(' · ');
  var d = new Date();
  var dateStr = d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
  card.innerHTML =
    '<div class="st">调音成绩单</div>'+
    '<div class="small mt8">'+escapeHtml(carName)+' · '+dateStr+'</div>'+
    '<div class="small mt8 num" style="color:var(--cyan);">'+escapeHtml(gains)+'</div>'+
    '<div class="small mt8" style="color:var(--sub);">'+escapeHtml(tt('report.trustNote'))+'</div>';
  card.classList.remove('hidden');
  var txt = tf('plan.shareCopyText')({car:carName, date:dateStr, gains:gains});
  var done = function(ok){
    track('plan_share_copy', {ok:!!ok});
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(String(txt)).then(function(){done(true);}, function(){done(false);});
  }else{
    var ta=document.createElement('textarea'); ta.value=String(txt); document.body.appendChild(ta);
    ta.select(); try{ document.execCommand('copy'); done(true); }catch(_){ done(false); }
    document.body.removeChild(ta);
  }
}

/* =====================================================================
 * 复测验证闭环（v2）：方案应用后 → 复测（完整两步：底噪+立体声）→ 残差/贴合度对比
 * 规则铁律沿用 v1：cut-only / 梳状禁补偿 / 防烧喇叭 / 不推荐硬件升级。
 * 残差 R = mean(|meas31 − target31|)；贴合度 fit = max(0, 1 − R/12) × 100%，
 * 其中 12dB 为满量程参考（口径固定，见 REMEASURE_FULLSCALE_DB）。
 * __REMEASURE_V1__
 * ===================================================================== */
var REMEASURE_TARGET = 'CarAudio-TC-Parked-v1'; // 所用目标曲线版本（与 DSP.TARGET 一致）
var REMEASURE_FULLSCALE_DB = 12;                // 贴合度满量程参考：12dB
var REMEASURE_MAX_KEEP = 3;                     // S().remeasure 最多保留最近 3 次

function target31(){
  var iso = DSP.ISO31 || [], out = [], i;
  for(i=0;i<iso.length;i++){ try{ out.push(DSP.targetDbAt(iso[i])); }catch(_){ out.push(0); } }
  return out;
}
function residual31(measArr, tgtArr){
  var n = Math.min(measArr.length, tgtArr.length), s = 0, c = 0, i;
  for(i=0;i<n;i++){
    var m = measArr[i], g = tgtArr[i];
    if(typeof m!=='number' || typeof g!=='number') continue;
    s += Math.abs(m - g); c++;
  }
  return c ? s/c : NaN;
}
function fitOf(residualDb){
  if(!(residualDb>=0)) return 0;
  return Math.max(0, 1 - residualDb/REMEASURE_FULLSCALE_DB)*100;
}
function measArrOf(m){ return (m && m.band31) || m || []; }

/* 复测入口：先提示按方案调好车机 EQ（用户点「开始」后才真正测量） */
function startRemeasurePrompt(){
  if(!S().measL){ show('measure'); return; } // 无调前基线：回到测量页
  // v2.9.42: 免费重测限 2 次（v1.2 协议 4.2），超限转客服
  var _rc = 0;
  try{ _rc = parseInt(localStorage.getItem('ct_remeasure_count')||'0', 10)||0; }catch(_){}
  if(_rc >= 2){
    try{
      var ov = document.createElement('div');
      ov.className = 'iso-overlay';
      ov.innerHTML =
        '<div class="iso-card">' +
        '<div class="h" style="font-size:17px;">免费重测次数已用完</div>' +
        '<div class="small mt8">您已使用 2 次免费重测。如仍有问题，请联系客服人工处理。</div>' +
        '<button class="btn btn-primary" id="rc-ok">知道了</button>' +
        '</div>';
      document.body.appendChild(ov);
      ov.querySelector('#rc-ok').onclick = function(){ try{ document.body.removeChild(ov); }catch(_){} };
    }catch(_){}
    trackSecurity('remeasure_limit_hit', {count:_rc});
    return;
  }
  try{ localStorage.setItem('ct_remeasure_count', String(_rc+1)); }catch(_){}
  setText('remeasure-title','remeasure.title');
  setText('remeasure-prompt-title','remeasure.promptTitle');
  setText('remeasure-prompt-body','remeasure.promptBody');
  setText('bk-remeasure','common.back');
  document.getElementById('remeasure-prompt').classList.remove('hidden');
  document.getElementById('remeasure-result').classList.add('hidden');
  ON_SHOW.remeasure = null;
  CTA.remeasure = [
    { text: tt('remeasure.startBtn'), onClick: startRemeasureFlow },
    { text: tt('common.back'), primary:false, onClick: function(){ show('plan'); } }
  ];
  show('remeasure');
  track('remeasure_prompt');
}
/* 复测测量：切到测量页（进度 UI 在此），复用完整两步流程（底噪 30s + 立体声 30s），
   SNR/削顶门控与初测一致；输出路由到 finishRemeasure，不覆盖调前数据 */
function startRemeasureFlow(){
  track('remeasure_start');
  show('measure');
  startMeasureFlow({isRemeasure:true});
}
/* 复测失败/削顶时重试仍走复测入口（而非初测入口） */
function retryMeasureFn(){
  return app._remeasureMode ? startRemeasureFlow : startMeasureFlow;
}
/* 复测完成：对比调前/调后残差与贴合度，落盘 S().remeasure（最多 3 次），展示对比卡 */
function finishRemeasure(meas){
  app._remeasureMode = false;
  var before = avg31();            // 调前（S().measL/measR，复测不覆盖）
  var after = measArrOf(meas);     // 调后
  var tgt = target31();
  var r1 = residual31(before, tgt), r2 = residual31(after, tgt);
  var f1 = fitOf(r1), f2 = fitOf(r2);
  var entry = {
    ts: Date.now(),
    r1: +r1.toFixed(2), r2: +r2.toFixed(2),
    fit1: +f1.toFixed(1), fit2: +f2.toFixed(1),
    target: REMEASURE_TARGET,                 // 所用目标曲线版本
    dsp: (window.DSP && DSP.version) || '',   // 算法层版本
    playMode: app.playMode,
    snr: (meas && typeof meas.snrDb==='number') ? +meas.snrDb.toFixed(1) : null
  };
  var s = S();
  if(!Array.isArray(s.remeasure)) s.remeasure = [];
  s.remeasure.push(entry);
  while(s.remeasure.length > REMEASURE_MAX_KEEP) s.remeasure.shift(); // 只留最近 3 次
  track('remeasure_done', {r1:entry.r1, r2:entry.r2, fit1:entry.fit1, fit2:entry.fit2});
  renderRemeasureResult(entry, before, after, tgt);
  show('remeasure');
}
/* 对比卡渲染：大数字贴合度 X% → Y%、诚实结论、三线图、历史记录 */
function renderRemeasureResult(entry, before, after, tgt){
  setText('remeasure-title','remeasure.title');
  setText('bk-remeasure','common.back');
  setText('remeasure-fit-title','remeasure.fitTitle');
  setText('remeasure-history-title','remeasure.historyTitle');
  setText('remeasure-note','remeasure.note');
  document.getElementById('remeasure-prompt').classList.add('hidden');
  document.getElementById('remeasure-result').classList.remove('hidden');
  var a = Math.round(entry.fit1), b = Math.round(entry.fit2);
  document.getElementById('remeasure-fitline').textContent = tf('remeasure.fitFromTo')(a, b);
  var v = document.getElementById('remeasure-verdict');
  if(b > a){
    v.textContent = tt('remeasure.better');
    v.style.color = 'var(--green)';
  }else{
    // 诚实：没提升就是没提升，不编造提升
    v.textContent = tt('remeasure.noBetter');
    v.style.color = 'var(--amber)';
  }
  var lg = document.getElementById('remeasure-legend');
  lg.innerHTML =
    '<span><i style="background:#22D3EE"></i>'+escapeHtml(tt('remeasure.legendBefore'))+'</span>'+
    '<span><i style="background:#34D399"></i>'+escapeHtml(tt('remeasure.legendAfter'))+'</span>'+
    '<span><i style="background:#FF9F1C"></i>'+escapeHtml(tt('remeasure.legendTarget'))+'</span>';
  ON_SHOW.remeasure = function(){ drawRemeasureChart(before, after, tgt); }; // 可见后重绘
  renderRemeasureHistory();
  CTA.remeasure = [
    { text: tt('remeasure.startBtn'), primary:false, onClick: startRemeasurePrompt },
    { text: tt('common.back'), primary:false, onClick: function(){ show('plan'); } }
  ];
  renderCTA(CTA.remeasure);
}
/* 三线图：调前（青）vs 调后（绿）vs 目标（橙），复用报告页的对数频率轴画法 */
function drawRemeasureChart(before, after, tgt){
  var cv = document.getElementById('remeasure-chart');
  if(!cv) return;
  var g = fitCanvas(cv, 220), ctx=g.ctx, W=g.w, H=g.h;
  ctx.clearRect(0,0,W,H);
  var iso = DSP.ISO31 || [];
  var all = before.concat(after, tgt);
  var mn=Math.min.apply(null,all)-2, mx=Math.max.apply(null,all)+2;
  function X(f){ var l0=Math.log10(20), l1=Math.log10(20000); return 34+(Math.log10(f)-l0)/(l1-l0)*(W-44); }
  function Y(db){ return 14+(1-(db-mn)/(mx-mn))*(H-38); }
  ctx.strokeStyle='rgba(255,255,255,.06)'; ctx.lineWidth=1;
  [20,50,100,200,500,1000,2000,5000,10000,20000].forEach(function(f){
    ctx.beginPath(); ctx.moveTo(X(f),14); ctx.lineTo(X(f),H-24); ctx.stroke();
    ctx.fillStyle='#5b6472'; ctx.font='9px sans-serif'; ctx.textAlign='center';
    ctx.fillText(f>=1000?(f/1000)+'k':f, X(f), H-10);
  });
  function line(arr, color, width){
    ctx.strokeStyle=color; ctx.lineWidth=width; ctx.beginPath();
    for(var i=0;i<iso.length && i<arr.length;i++){
      var x=X(iso[i]), y=Y(arr[i]);
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  line(tgt,'#FF9F1C',2);    // 目标曲线
  line(before,'#22D3EE',2); // 调前实测
  line(after,'#34D399',2);  // 调后实测
}
function renderRemeasureHistory(){
  var box = document.getElementById('remeasure-history');
  if(!box) return;
  box.innerHTML = '';
  var list = S().remeasure || [];
  if(!list.length){
    var d = document.createElement('div');
    d.className = 'small';
    d.textContent = tt('remeasure.emptyHistory');
    box.appendChild(d);
    return;
  }
  var ul = document.createElement('ul');
  ul.className = 'clean';
  list.slice().reverse().forEach(function(en){
    var li = document.createElement('li');
    li.className = 'small';
    var dt = new Date(en.ts);
    var ds = dt.getFullYear()+'-'+(dt.getMonth()+1)+'-'+dt.getDate()+' '+
             ('0'+dt.getHours()).slice(-2)+':'+('0'+dt.getMinutes()).slice(-2);
    li.textContent = tf('remeasure.historyItem')(ds, Math.round(en.fit1), Math.round(en.fit2));
    ul.appendChild(li);
  });
  box.appendChild(ul);
}

}
function init(){
  // 内测时限：到期后只显示全屏结束卡，不渲染主界面
  if(betaExpired()){
    setText('beta-expired-t','beta.expiredTitle');
    setText('beta-expired-b','beta.expiredBody');
    var ov = document.getElementById('beta-expired');
    if(ov) ov.style.display = 'flex';
    return;
  }
  if(!window.DSP){ document.getElementById('app').innerHTML = '<div class="card" style="margin-top:40px;">DSP 未注入（构建占位未替换）</div>'; return; }
  if(!window.COPY){ console.warn('[COPY] window.COPY 缺失，文案将降级显示 key 名'); window.COPY = {}; }
  initBackButtons();
  initWxBanner();
  initHome();
  initChecklist();
  initCar();
  initBounty();
  initMeasure();
  initConsent();
  initPay();
  initTech();
  show('home');
  // 内测到期前 7 天：首页温和提示（不阻塞）
  if(betaExpiringSoon()){
    var soon = document.getElementById('home-beta-soon');
    if(soon){ soon.textContent = tf('beta.expiringSoon')(betaExpiryDateStr()); soon.classList.remove('hidden'); }
  }
  track('app_open', {pro:false});
}
if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded', init); }
else{ init(); }
</script>
<!-- 内测到期全屏卡 -->
<div id="beta-expired" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:9999;align-items:center;justify-content:center;padding:24px;">
  <div class="card center" style="max-width:320px;">
    <div class="h" id="beta-expired-t" style="margin-bottom:8px;"></div>
    <div class="small" id="beta-expired-b"></div>
  </div>
</div>
</body>
</html>
