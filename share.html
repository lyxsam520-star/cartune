    if (wantScore != null) {
      for (var i = 0; i < items.length; i++) {
        if (String(items[i].score) === String(wantScore) && (!wantSeries || items[i].series === wantSeries) && (!wantYear || items[i].year === wantYear)) { pick = items[i]; break; }
      }
    }
    if (!pick) {
      pick = items[0];
      for (var k = 1; k < items.length; k++) { if (Number(items[k].score) > Number(pick.score)) pick = items[k]; }
    }
    render(pick);
  }).catch(function(){ render(fallback); });
})();
</script>
