<!DOCTYPE html>
<html lang="zh-CN">
<head>
<!-- v1 build: dsp.js + copy.js inlined at build time | 规则引擎层(v1) / LLM文案层(v2预留，见DSP.llmHook) -->

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B0E13">
<title>车载音响调音</title>
<style>
/* ============ 视觉语言（严格执行） ============ */
:root{
  --bg:#0B0E13;
  --card:#141A23;
  --border:rgba(255,255,255,.06);
  --text:#E8EDF3;
  --sub:#8B94A3;
  --amber:#FF9F1C;      /* CTA / 高亮 */
  --cyan:#22D3EE;       /* 曲线 / 测量实时 */
  --red:#FF4D4D;        /* 危险 */
  --green:#34D399;
  --r:16px;
  --sat:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  font-size:17px;line-height:1.6;
  -webkit-text-size-adjust:100%;
}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding:0 16px calc(96px + var(--sat));}
/* 顶部微信提示条 */
#wx-banner{display:none;background:#1a2230;color:var(--sub);font-size:12px;text-align:center;padding:8px 16px;border-bottom:1px solid var(--border);}
#wx-banner.show{display:block;}
/* 版块 */
.sec{display:none;padding-top:20px;animation:fadein .25s ease;}
.sec.active{display:block;}
@keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
/* 字号层级 */
.hero{font-size:20px;font-weight:600;line-height:1.5;margin:12px 0 8px;letter-spacing:.5px;}
.h{font-size:20px;font-weight:600;margin:0 0 6px;line-height:1.5;}
.body14{font-size:14px;color:var(--text);}
.small{font-size:12px;color:var(--sub);}
.num{font-variant-numeric:tabular-nums;}
/* 卡片 */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin:12px 0;}
.card.dim{opacity:.55;}
/* 徽章 */
.badge{display:inline-block;font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--border);color:var(--sub);vertical-align:middle;}
.badge.amber{color:var(--amber);border-color:rgba(255,159,28,.4);background:rgba(255,159,28,.08);}
.badge.cyan{color:var(--cyan);border-color:rgba(34,211,238,.4);background:rgba(34,211,238,.08);}
.badge.red{color:var(--red);border-color:rgba(255,77,77,.45);background:rgba(255,77,77,.08);}
.badge.green{color:var(--green);border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.08);}
/* 按钮 */
#cta-bar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:linear-gradient(180deg,rgba(11,14,19,0),rgba(11,14,19,.92) 28%);
  padding:18px 16px calc(12px + var(--sat));
}
#cta-bar .inner{max-width:480px;margin:0 auto;display:flex;gap:10px;flex-wrap:wrap;}
.cta-sub{flex:0 0 100%;text-align:center;font-size:12px;color:var(--sub);}
.btn{
  flex:1;display:block;width:100%;border:none;border-radius:14px;
  font-size:18px;font-weight:700;padding:15px 12px;cursor:pointer;
  font-family:inherit;
}
.btn-primary{background:var(--amber);color:#231400;}
.btn-primary:disabled{background:#3a3f4a;color:#7a828f;cursor:not-allowed;}
.btn-ghost{background:transparent;color:var(--text);border:1px solid var(--border);flex:0 0 auto;padding:15px 18px;}
.btn-danger-ghost{background:transparent;color:var(--red);border:1px solid rgba(255,77,77,.4);}
/* 声道隔离自检弹窗 */
.iso-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;}
.iso-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;width:100%;max-width:340px;}
.iso-card .btn{margin-top:12px;}
/* 顶部返回 */
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
.backbtn{background:none;border:none;color:var(--sub);font-size:14px;padding:8px 4px;cursor:pointer;font-family:inherit;}
.backbtn::before{content:"‹ ";font-size:18px;line-height:1;}
.linklike{background:none;border:none;color:var(--cyan);font-size:14px;padding:10px 4px;cursor:pointer;font-family:inherit;text-decoration:underline;text-underline-offset:3px;}
/* 开关 */
.switchrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;}
.switch{position:relative;width:52px;height:30px;flex:0 0 auto;}
.switch input{opacity:0;width:100%;height:100%;position:absolute;margin:0;cursor:pointer;z-index:2;}
.knob{position:absolute;inset:0;background:#2a3240;border-radius:999px;transition:.2s;border:1px solid var(--border);}
.knob::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#8B94A3;transition:.2s;}
.switch input:checked + .knob{background:rgba(255,159,28,.25);border-color:var(--amber);}
.switch input:checked + .knob::after{left:25px;background:var(--amber);}
/* 表单 */
.field{margin:12px 0;}
.field label{display:block;font-size:12px;color:var(--sub);margin-bottom:6px;}
.input,select.input{
  width:100%;background:#0f141c;border:1px solid var(--border);border-radius:12px;
  color:var(--text);font-size:15px;padding:13px 12px;font-family:inherit;outline:none;
}
.input:focus{border-color:var(--amber);}
.input.err{border-color:var(--red);}
.hint{font-size:12px;color:var(--sub);margin-top:6px;}
.errtext{font-size:12px;color:var(--red);margin-top:6px;display:none;}
.errtext.show{display:block;}
/* 车型下拉 */
#model-results{list-style:none;margin:6px 0 0;padding:0;max-height:220px;overflow:auto;border:1px solid var(--border);border-radius:12px;background:#0f141c;display:none;}
#model-results.show{display:block;}
#model-results li{padding:12px;border-bottom:1px solid var(--border);cursor:pointer;font-size:14px;}
#model-results li:last-child{border-bottom:none;}
#model-results li:active{background:#1a2230;}
/* 三级联选 */
.picklist{list-style:none;margin:6px 0 0;padding:0;max-height:240px;overflow:auto;border:1px solid var(--border);border-radius:12px;background:#0f141c;display:none;}
.picklist.show{display:block;}
.picklist li{padding:12px;border-bottom:1px solid var(--border);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.picklist li:last-child{border-bottom:none;}
.picklist li:active{background:#1a2230;}
.picklist li.sel{color:var(--amber);}
.picklist li.sel::after{content:'\2713';font-weight:700;}
#band-btns .btn.picked{border-color:var(--amber);color:var(--amber);}
/* 步骤条 */
.step{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--border);}
.step:last-child{border-bottom:none;}
.stepdot{flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:1px solid var(--border);color:var(--sub);font-size:12px;display:flex;align-items:center;justify-content:center;margin-top:2px;}
.step.active .stepdot{border-color:var(--cyan);color:var(--cyan);}
.step.done .stepdot{border-color:var(--green);color:var(--green);}
.prog{height:6px;background:#232b38;border-radius:999px;margin-top:10px;overflow:hidden;}
.prog > i{display:block;height:100%;width:0;background:var(--cyan);border-radius:999px;transition:width .2s linear;}
/* 选项卡 */
.tabs{display:flex;gap:10px;margin:12px 0;}
.tab{flex:1;border:1px solid var(--border);border-radius:14px;padding:14px 10px;text-align:center;cursor:pointer;background:var(--card);}
.tab .t{font-size:15px;font-weight:700;}
.tab .n{font-size:12px;color:var(--sub);margin-top:4px;}
.tab.sel{border-color:var(--amber);background:rgba(255,159,28,.07);}
.tab.sel .t{color:var(--amber);}
/* 实时柱 */
#bars-wrap{margin:8px 0;}
#bars{width:100%;height:190px;display:block;background:#0d1219;border:1px solid var(--border);border-radius:12px;}
#bar-labels{display:flex;margin-top:6px;}
#bar-labels span{flex:1;text-align:center;font-size:10px;color:var(--sub);line-height:1.5;padding:0 2px;}
#bars31{width:100%;height:64px;display:block;background:#0d1219;border:1px solid var(--border);border-radius:10px;margin-top:8px;}
/* 电平条 */
.levelrow{display:flex;align-items:center;gap:10px;margin-top:10px;}
#levelbar{flex:1;height:10px;background:#232b38;border-radius:999px;overflow:hidden;}
#levelfill{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--amber));}
#leveldb{font-size:12px;color:var(--sub);min-width:76px;text-align:right;}
/* 报警 */
.alert{display:none;border-radius:12px;padding:12px 14px;font-size:14px;margin:10px 0;}
.alert.show{display:block;}
.alert.red.show{display:block;background:rgba(255,77,77,.1);border:1px solid rgba(255,77,77,.45);color:#ffb3b3;}
.alert.amber.show{display:block;background:rgba(255,159,28,.08);border:1px solid rgba(255,159,28,.4);color:#ffd9a0;}
/* 复选框 */
.checkrow{display:flex;gap:12px;align-items:flex-start;padding:12px 0;}
.checkrow input[type=checkbox]{width:22px;height:22px;margin-top:2px;accent-color:var(--amber);flex:0 0 auto;}
/* 增益卡 */
.gaincard{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin:10px 0;display:flex;align-items:center;gap:12px;}
.gaincard .gl{flex:1;}
.gaincard .gt{font-size:15px;font-weight:700;}
.gaincard .gc{font-size:12px;color:var(--sub);margin-top:2px;}
.gaincard .gv{font-size:20px;font-weight:800;color:var(--cyan);}
.gaincard.boost .gv{color:var(--amber);}
.gaincard.comb{border-color:rgba(255,77,77,.5);background:rgba(255,77,77,.05);}
.gaincard.comb .gv{color:var(--red);}
.gaincard .tag{font-size:10px;padding:2px 8px;border-radius:999px;border:1px solid var(--border);color:var(--sub);}
/* 图例 */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:8px;}
.legend i{display:inline-block;width:18px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle;}
canvas.chart{width:100%;height:220px;display:block;background:#0d1219;border:1px solid var(--border);border-radius:12px;}
/* 分享卡 */
#share-card{background:linear-gradient(160deg,#18202e,#10151d);border:1px solid rgba(255,159,28,.35);border-radius:var(--r);padding:20px;margin:14px 0;}
#share-card .st{font-size:17px;font-weight:800;}
/* 列表 */
ul.clean{margin:8px 0;padding-left:20px;color:var(--text);}
ul.clean li{margin:6px 0;}
.kv{display:flex;justify-content:space-between;font-size:14px;padding:8px 0;border-bottom:1px solid var(--border);}
.kv:last-child{border-bottom:none;}
.kv .k{color:var(--sub);}
.price{font-size:20px;font-weight:800;color:var(--amber);}
.center{text-align:center;}
.mt8{margin-top:8px;}.mt16{margin-top:16px;}
.hidden{display:none !important;}
</style>
</head>
<body>
<div id="wx-banner"></div>
<div id="app">

  <!-- ============ 1. 首页 ============ -->
  <section class="sec" id="sec-home">
    <div class="center" style="padding-top:34px;">
      <span class="badge amber" id="home-badge"></span>
      <div class="hero" id="home-title"></div>
      <div class="small" id="home-sub" style="max-width:340px;margin:0 auto;"></div>
    </div>
    <div class="card center mt16">
      <div class="switchrow" style="padding:4px 0 12px;">
        <div style="text-align:left;">
          <div class="h" id="home-pro-label" style="font-size:15px;"></div>
          <div class="small" id="home-pro-desc"></div>
        </div>
        <label class="switch"><input type="checkbox" id="pro-toggle"><span class="knob"></span></label>
      </div>
      <button class="linklike" id="home-tech-link"></button>
    </div>
    <div class="small center" id="home-payhint" style="margin-top:10px;"></div>
  </section>

  <!-- ============ 2. 标准条件检查 ============ -->
  <section class="sec" id="sec-checklist">
    <div class="topbar"><button class="backbtn" data-back="sec-home" id="bk-checklist"></button></div>
    <div class="h" id="checklist-title"></div>
    <div class="small" id="checklist-sub"></div>
    <div id="checklist-items"></div>
    <div class="card">
      <div class="small" id="checklist-pink"></div>
      <div class="small mt8" id="checklist-bt"></div>
      <div class="small mt8" id="checklist-safe" style="color:var(--amber);"></div>
    </div>
  </section>

  <!-- ============ 3. 车型选择 ============ -->
  <section class="sec" id="sec-car">
    <div class="topbar"><button class="backbtn" data-back="sec-checklist" id="bk-car"></button></div>
    <div class="h" id="car-title"></div>
    <div class="small" id="car-sub"></div>
    <!-- 车型：单一搜索框 → 车系列表 → 年款列表（三步走） -->
    <div class="field" id="car-search-wrap">
      <label id="car-search-label"></label>
      <div style="position:relative;">
        <input class="input" id="car-q" autocomplete="off" style="padding-right:40px;">
        <button id="car-q-clear" class="hidden" style="position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--sub);font-size:16px;padding:10px;cursor:pointer;font-family:inherit;">&#10005;</button>
      </div>
      <ul id="car-results" class="picklist"></ul>
    </div>
    <div class="field hidden" id="car-list-wrap">
      <div id="car-crumb" class="small" style="margin-bottom:6px;"></div>
      <ul id="car-list" class="picklist show"></ul>
    </div>
    <!-- 已选汇总 -->
    <div id="car-selected" class="card hidden">
      <div style="display:flex;align-items:center;gap:10px;">
        <div style="flex:1;">
          <div class="small" id="car-selected-k"></div>
          <div class="h" style="font-size:17px;margin-top:2px;" id="car-selected-text"></div>
        </div>
        <button class="linklike" id="car-change"></button>
      </div>
    </div>
    <div id="eqspec-panel"></div>
    <div id="band-picker" class="card hidden">
      <div class="small" id="band-picker-tip" style="margin-bottom:10px;"></div>
      <div style="display:flex;gap:8px;" id="band-btns"></div>
    </div>
    <div class="field">
      <label id="car-hu-label"></label>
      <input class="input num" id="car-hu" inputmode="decimal">
      <div class="hint" id="car-hu-hint"></div>
    </div>
    <button class="linklike" id="car-manual-toggle"></button>
    <div id="car-manual-box" class="hidden">
      <div class="field">
        <label id="car-year-manual-label"></label>
        <input class="input num" id="car-year-manual" inputmode="numeric" placeholder="2026">
        <div class="errtext" id="car-year-err"></div>
      </div>
    </div>
    <div class="errtext" id="car-cta-err" style="margin-bottom:8px;"></div>
  </section>
  <!-- ============ 4. 测量 ============ -->
  <section class="sec" id="sec-measure">
    <div class="topbar"><button class="backbtn" data-back="sec-car" id="bk-measure"></button></div>
    <div class="h" id="measure-title"></div>
    <div class="small" id="measure-safe" style="color:var(--amber);"></div>
    <div class="tabs">
      <div class="tab sel" id="tab-bt"><div class="t"></div><div class="n"></div></div>
      <div class="tab" id="tab-usb"><div class="t"></div><div class="n"></div></div>
    </div>
    <div class="alert amber" id="usb-tip"></div>
    <div class="alert amber show" id="case-tip"></div>
    <div class="alert amber show" id="position-tip"></div>
    <div class="card" id="measure-card">
      <div id="measure-steps"></div>
      <div class="small mt8" id="measure-status"></div>
    </div>
    <div id="bars-wrap">
      <div class="small" id="bars-caption" style="margin-bottom:6px;"></div>
      <canvas id="bars"></canvas>
      <div id="bar-labels"></div>
      <div id="pro31-wrap" class="hidden">
        <div class="small mt8" style="color:var(--cyan);">内部分析视图 · 31 段</div>
        <canvas id="bars31"></canvas>
      </div>
    </div>
    <div class="levelrow">
      <div id="levelbar"><i id="levelfill"></i></div>
      <div id="leveldb" class="num">-- dBFS</div>
    </div>
    <div class="alert red" id="clip-alert"></div>
    <div class="alert amber" id="snr-alert"></div>
    <div class="alert red" id="valid-alert"></div>
    <div class="alert amber" id="mix-alert"></div>
    <div class="card hidden" id="mic-err-card">
      <div class="h" id="mic-err-title"></div>
      <div class="small" id="mic-err-body"></div>
      <div style="display:flex;gap:10px;" class="mt8">
        <button class="btn btn-ghost" id="mic-retry"></button>
        <button class="btn btn-ghost" id="mic-totech"></button>
      </div>
    </div>
  </section>

  <!-- ============ 5. 免费报告 ============ -->
  <section class="sec" id="sec-report">
    <div class="topbar"><button class="backbtn" data-back="sec-measure" id="bk-report"></button></div>
    <div class="h" id="report-title"></div>
    <div class="card center">
      <div class="hero num" id="report-found" style="color:var(--amber);margin:6px 0;"></div>
    </div>
    <div class="h mt16" id="report-preview-title" style="font-size:15px;"></div>
    <canvas class="chart" id="report-chart"></canvas>
    <div class="legend" id="report-legend"></div>
    <div class="card mt16"><div class="small" id="report-trust"></div></div>
    <div class="small center mt8" id="report-priceline"></div>
  </section>

  <!-- ============ 6. 授权 ============ -->
  <section class="sec" id="sec-consent">
    <div class="topbar"><button class="backbtn" data-back="sec-report" id="bk-consent"></button></div>
    <div class="h" id="consent-title"></div>
    <div class="card">
      <label class="checkrow"><input type="checkbox" id="c1">
        <span><span class="body14" id="consent-c1t" style="font-weight:600;"></span><br><span class="small" id="consent-c1d"></span></span></label>
      <label class="checkrow"><input type="checkbox" id="c2">
        <span><span class="body14" id="consent-c2t" style="font-weight:600;"></span><br><span class="small" id="consent-c2d"></span></span></label>
    </div>
  </section>

  <!-- ============ 7. 付费 ============ -->
  <section class="sec" id="sec-pay">
    <div class="topbar"><button class="backbtn" data-back="sec-consent" id="bk-pay"></button></div>
    <div class="h" id="pay-title"></div>
    <div><span class="badge amber" id="pay-testbadge"></span></div>
    <div class="card center mt16">
      <div class="price num" id="pay-price"></div>
      <ul class="clean" style="text-align:left;" id="pay-includes"></ul>
    </div>
    <div class="card"><div class="small" id="pay-refund"></div></div>
    <div class="card"><div class="small" id="pay-virtual"></div></div>
    <div class="card"><div class="small" id="pay-invoice"></div></div>
    <div class="card"><div class="small" id="pay-week"></div></div>
  </section>

  <!-- ============ 8. 方案 ============ -->
  <section class="sec" id="sec-plan">
    <div class="topbar"><button class="backbtn" data-back="sec-pay" id="bk-plan"></button></div>
    <div id="plan-normal">
      <div class="h" id="plan-title"></div>
      <div class="small" id="plan-sub"></div>
      <div class="small mt8" id="plan-perband"></div>
      <div id="plan-bands"></div>
      <div class="card" style="border-color:rgba(255,77,77,.5);">
        <div class="h" id="plan-burnt" style="color:var(--red);font-size:15px;"></div>
        <div class="small" id="plan-burnb"></div>
      </div>
      <div class="card">
        <div class="h" id="plan-restoret" style="font-size:15px;"></div>
        <ul class="clean" id="plan-restoresteps"></ul>
      </div>
      <div class="small" id="plan-avgnote"></div>
      <div id="share-card" class="hidden"></div>
    </div>
    <div id="plan-et9" class="hidden">
      <div class="h" id="plan-et9t"></div>
      <div class="small" id="plan-et9b"></div>
    </div>
  </section>

  <!-- ============ 悬赏计划 ============ -->
  <section class="sec" id="sec-bounty">
    <div class="topbar"><button class="backbtn" data-back="sec-car" id="bk-bounty"></button></div>
    <div class="h" id="bounty-title"></div>
    <div class="small" id="bounty-sub"></div>
    <div class="card"><div class="small" id="bounty-intro"></div></div>
    <div class="card">
      <div class="h" style="font-size:15px;" id="bounty-steps-t"></div>
      <ul class="clean" id="bounty-steps"></ul>
    </div>
    <div class="card" style="border-color:rgba(255,159,28,.45);">
      <div class="small" id="bounty-reward"></div>
    </div>
    <button class="btn btn-primary" id="bounty-signup" style="width:100%;"></button>
    <div class="small mt8" style="color:var(--sub);" id="bounty-note"></div>
  </section>
  <!-- ============ 9. 技术原理 ============ -->
  <section class="sec" id="sec-tech">
    <div class="topbar"><button class="backbtn" data-back="sec-home" id="bk-tech"></button></div>

  /**
   * 按品牌/车系模糊搜索车型（大小写不敏感，子串匹配）
   * @param {string} q 关键词
   * @returns {Array} 命中的车型条目
   */
  DSP.findModels = function (q) {
    q = String(q == null ? '' : q).toLowerCase();
    if (!q) return DSP.MODELS.slice();
    var out = [];
    for (var i = 0; i < DSP.MODELS.length; i++) {
      var m = DSP.MODELS[i];
      var hay = (m.brand + ' ' + m.series + ' ' + m.years).toLowerCase();
      if (hay.indexOf(q) !== -1) out.push(m);
    }
    return out;
  };

  /* ============================================================
   * 2. 粉红噪声（Paul Kellet 1999 滤波器法）
   * 依据：与 REW 生成器同源算法；实测 20Hz 需约 5s 收敛，
   * 因此固定丢弃前 5 秒（热机），1s 热机会在 20Hz 留 -0.85dB 偏差。
   * ============================================================ */

  function dbToPower(db) {
    if (!(db > -120)) return 0; // 顺带过滤 -Infinity / NaN
    return Math.pow(10, db / 10);
  }
  function powerToDb(p) {
    if (!(p > 0)) return -120;
    return 10 * Math.log(p) / Math.LN10;
  }
  // 供模块内部复用的 dB<->功率工具也挂到 DSP 上，方便单元测试
  DSP.dbToPower = dbToPower;
  DSP.powerToDb = powerToDb;

  /**
   * 生成单声道粉红噪声（Float32Array，峰值归一到 ±0.9 防削顶）
   * @param {number} sampleRate 采样率
   * @param {number} seconds 需要的时长（秒）
   */
  DSP.makePinkMono = function (sampleRate, seconds) {
    var WARMUP_SEC = 5; // 热机丢弃时长
    var total = Math.floor(sampleRate * (seconds + WARMUP_SEC));
    var need = Math.floor(sampleRate * seconds);
    var warmup = total - need;
    var b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
    var out = new Float32Array(need);
    var peak = 0;
    var i, w, s;
    for (i = 0; i < total; i++) {
      w = Math.random() * 2 - 1;
      b0 = 0.99886 * b0 + w * 0.0555179;
      b1 = 0.99332 * b1 + w * 0.0750759;
      b2 = 0.96900 * b2 + w * 0.1538520;
      b3 = 0.86650 * b3 + w * 0.3104856;
      b4 = 0.55000 * b4 + w * 0.5329522;
      b5 = -0.7616 * b5 - w * 0.0168980;
      b6 = w * 0.115926;
      s = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11;
      if (i >= warmup) {
        var j = i - warmup;
        out[j] = s;
        var a = s < 0 ? -s : s;
        if (a > peak) peak = a;
      }
    }
    // 峰值归一到 0.9，留出 headroom，避免播放链路削顶
    var g = peak > 0 ? 0.9 / peak : 1;
    for (i = 0; i < need; i++) out[i] *= g;
    return out;
  };

  /**
   * 生成立体声粉噪 AudioBuffer，用于 L/R 独立测量
   * @param {AudioContext} ctx
   * @param {number} seconds 时长（秒）
   * @param {string} side 'L' 左声道粉噪/右静音；'R' 反之；其他=双声道
   */
  DSP.makeStereoPink = function (ctx, seconds, side) {
    var sr = ctx.sampleRate;
    var mono = DSP.makePinkMono(sr, seconds);
    var buf = ctx.createBuffer(2, mono.length, sr);
    var ch0 = buf.getChannelData(0), ch1 = buf.getChannelData(1);
    var i;
    if (side === 'R') {
      for (i = 0; i < mono.length; i++) { ch0[i] = 0; ch1[i] = mono[i]; }
    } else if (side === 'L') {
      for (i = 0; i < mono.length; i++) { ch0[i] = mono[i]; ch1[i] = 0; }
    } else {
      for (i = 0; i < mono.length; i++) { ch0[i] = mono[i]; ch1[i] = mono[i]; }
    }
    return buf;
  };

  /* ============================================================
   * 3. 测量会话 Measurer
   *    - 内部分析恒为 31 段 1/3 倍频程；实时显示按车机 EQ 段数聚合

   * ============================================================ */

  // getUserMedia 兼容：标准 API 优先，webkit 前缀兜底
  function getUserMediaCompat(constraints) {
    if (typeof navigator !== 'undefined' &&
        navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      return navigator.mediaDevices.getUserMedia(constraints);
    }
    var legacy = (typeof navigator !== 'undefined') &&
      (navigator.webkitGetUserMedia || navigator.mozGetUserMedia);
    if (legacy) {
      return new Promise(function (resolve, reject) {
        legacy.call(navigator, constraints, resolve, reject);
      });
    }
    return Promise.reject(new Error('当前浏览器不支持麦克风采集'));
  }

  // 把 analyser 频点（dB）聚合成 31 段：每段取中心 ±1/3 倍频程内频点的功率平均
  function aggregate31(freqData, sampleRate, fftSize) {
    var binHz = sampleRate / fftSize;
    var binCount = freqData.length;
    var out = new Array(31);
    var b, k;
    for (b = 0; b < 31; b++) {
      var fc = DSP.ISO31[b];
      var lo = fc * Math.pow(2, -1 / 3);
      var hi = fc * Math.pow(2, 1 / 3);
      var k0 = Math.max(1, Math.floor(lo / binHz)); // 跳过 DC
      var k1 = Math.min(binCount - 1, Math.ceil(hi / binHz));
      var sum = 0, cnt = 0;
      for (k = k0; k <= k1; k++) {
        sum += dbToPower(freqData[k]);
        cnt++;
      }
      out[b] = cnt > 0 ? powerToDb(sum / cnt) : -120;
    }
    return out;
  }

  var FFT_LADDER = [8192, 4096, 2048]; // 帧成本自适应降档阶梯

  DSP.Measurer = function () {
    this.audioCtx = null;
    this.stream = null;
    this.source = null;
    this.analyser = null;
    this.fftSize = 8192;
    this.sampleRate = 48000;
    this.eqSpec = null;       // 当前车机 EQ 规格（决定实时显示段数）
    this._pinkSrc = null;     // 播放中的粉噪源

  /**

  DSP.Measurer.prototype.init = function () {
    var self = this;
    return Promise.resolve().then(function () {

      if (!AC) throw new Error('当前浏览器不支持 Web Audio');
      try {
        self.audioCtx = new AC({ sampleRate: 48000 });
      } catch (e) {
        self.audioCtx = new AC();
      }
      self.sampleRate = self.audioCtx.sampleRate;
      var constraints = {
        audio: {
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl: false,
          channelCount: 1

      return getUserMediaCompat(constraints);

      self.source = self.audioCtx.createMediaStreamSource(stream);
      self._buildAnalyser();

      if (self.audioCtx.state === 'suspended') return self.audioCtx.resume();
    }).then(function () {
      return self;
    });
  };

  DSP.Measurer.prototype._buildAnalyser = function () {
    if (this.analyser) {
      try { this.analyser.disconnect(); } catch (e) {}
    }
    this.analyser = this.audioCtx.createAnalyser();
    this.analyser.fftSize = this.fftSize;
    this.analyser.smoothingTimeConstant = 0; // 不做时域平滑，平均在功率域做
    this.source.connect(this.analyser);

  // 帧成本自适应：连续 30 帧 getFloatFrequencyData+聚合 >16ms 则降一档
  DSP.Measurer.prototype._maybeDowngrade = function (costMs, slowStreak) {
    if (costMs > 16) slowStreak++;
    else slowStreak = 0;
    if (slowStreak >= 30) {
      var idx = FFT_LADDER.indexOf(this.fftSize);
      if (idx >= 0 && idx < FFT_LADDER.length - 1) {
        this.fftSize = FFT_LADDER[idx + 1];
        this._buildAnalyser();
        DSP.track('fft_downgrade', { fftSize: this.fftSize });
      }
      slowStreak = 0;
    }
    return slowStreak;
  };

  DSP.Measurer.prototype.setEqSpec = function (eqSpec) {
    this.eqSpec = eqSpec || null;
  };

  // 内部采集循环：seconds 秒，每帧调 onFrame；返回功率平均后的 31 段 dB
  DSP.Measurer.prototype._acquire = function (seconds, onFrame) {
    var self = this;
    return new Promise(function (resolve) {
      var sumPower = new Array(31);
      var b;
      for (b = 0; b < 31; b++) sumPower[b] = 0;
      var frames = 0;
      var slowStreak = 0;
      var freq = new Float32Array(self.analyser.frequencyBinCount);
      var time = new Float32Array(self.fftSize);
      var t0 = (typeof performance !== 'undefined') ? performance.now() : Date.now();
      self._stop = false;

      function now() {
        return (typeof performance !== 'undefined') ? performance.now() : Date.now();
      }
      function tick() {
        if (self._stop) { finish(); return; }
        var f0 = now();
        self.analyser.getFloatFrequencyData(freq);
        var cur31 = aggregate31(freq, self.sampleRate, self.fftSize);
        var cost = now() - f0;
        slowStreak = self._maybeDowngrade(cost, slowStreak);
        // analyser 重建后数组长度可能变化，同步一次
        if (freq.length !== self.analyser.frequencyBinCount) {
          freq = new Float32Array(self.analyser.frequencyBinCount);
        }
        if (time.length !== self.fftSize) {
          time = new Float32Array(self.fftSize);
        }
        for (b = 0; b < 31; b++) sumPower[b] += dbToPower(cur31[b]);
        frames++;
        // 削顶检测：时域峰值 ≥0.99 视为削顶（iOS 实测：音量变化会等比进入电平表，
        // 说明 Safari 未对麦克风做 AGC，因此削顶必须显式检测）
        self.analyser.getFloatTimeDomainData(time);
        var peak = 0, k;
        for (k = 0; k < time.length; k++) {
          var a = time[k] < 0 ? -time[k] : time[k];
          if (a > peak) peak = a;
        }
        var clipped = peak >= 0.99;
        if (onFrame) {
          onFrame({
            eqLevels: DSP.eqBandLevels(cur31, self.eqSpec),
            frameDb31: cur31,
            peak: peak,
            clipped: clipped
          });
        }
        if (now() - t0 >= seconds * 1000) { finish(); return; }
        setTimeout(tick, 0);
      }
      function finish() {
        var out = new Array(31);
        for (b = 0; b < 31; b++) {
          out[b] = frames > 0 ? powerToDb(sumPower[b] / frames) : -120;
        }
        resolve(out);
      }
      tick();
    });
  };

  /** 开始环境底噪采集：自动跑 30 秒（与测量同口径；粉噪随机信号的 1/3 倍频程波动

    this._stop = true;
    return this._floorPromise;
  };

  DSP.Measurer.prototype.abort = function () {

  };

  DSP.Measurer.prototype.playPink = function (side) {

    var buf = DSP.makeStereoPink(this.audioCtx, 30, side);
    var src = this.audioCtx.createBufferSource();
    src.buffer = buf;
    src.loop = true;
    src.connect(this.audioCtx.destination);
    src.start();
    this._pinkSrc = src;
  };
  DSP.Measurer.prototype.stopPink = function () {
    if (this._pinkSrc) {
      try { this._pinkSrc.stop(); } catch (e) {}
      try { this._pinkSrc.disconnect(); } catch (e) {}
      this._pinkSrc = null;
    }
  };

  /**
   * 采集 seconds 秒粉噪测量
   * @param {number} seconds
   * @param {function} onFrame 每帧回调 {eqLevels, frameDb31, peak, clipped}
   * @returns {Promise<number[31]>} 功率平均后的 meas31（dB）
   */
  DSP.Measurer.prototype.measure = function (seconds, onFrame) {
    return this._acquire(seconds, onFrame);
  };

  /** 释放：停采集、关粉噪、关 stream、关 AudioContext */
  DSP.Measurer.prototype.dispose = function () {
    this._stop = true;
    this.stopPink();
    if (this.stream) {
      var tracks = this.stream.getTracks();
      for (var i = 0; i < tracks.length; i++) {
        try { tracks[i].stop(); } catch (e) {}
      }
      this.stream = null;
    }
    if (this.audioCtx) {
      var ctx = this.audioCtx;
      this.audioCtx = null;
      if (ctx.close) { try { ctx.close(); } catch (e) {} }
    }
  };

  /* ============================================================
   * 4. 聚合显示：31 段 → 车机 EQ 段数
   * 每段取其中心频率 ±0.5 倍频程内 31 段值的功率平均（dB）。
   * centers 为 null（未知）时用 eqPresetFor(bands) 的经验中心频率兜底。
   * ============================================================ */
  DSP.eqBandLevels = function (levels31, eqSpec) {
    var spec = normalizeEqSpec(eqSpec);
    var centers = spec.centers;
    var out = new Array(centers.length);
    var b, i;
    for (b = 0; b < centers.length; b++) {
      var c = centers[b];
      var lo = c * Math.pow(2, -0.5);
      var hi = c * Math.pow(2, 0.5);
      var sum = 0, cnt = 0;
      for (i = 0; i < 31; i++) {
        var f = DSP.ISO31[i];
        if (f >= lo && f <= hi) {
          sum += dbToPower(levels31[i]);
          cnt++;
        }
      }
      out[b] = cnt > 0 ? powerToDb(sum / cnt) : -120;
    }
    return out;
  };

  // 规格归一化：bands=0（无可调EQ）直接返回空段；centers 缺失用经验预设兜底
  function normalizeEqSpec(eqSpec) {
    var bands = (eqSpec && eqSpec.bands) || 0;
    if (bands <= 0) {
      return { bands: 0, labels: [], centers: [], rangeDb: 0, stepDb: 1 };
    }
    var labels = (eqSpec && eqSpec.labels && eqSpec.labels.length === bands)
      ? eqSpec.labels.slice() : null;
    var centers = (eqSpec && eqSpec.centers && eqSpec.centers.length === bands)
      ? eqSpec.centers.slice() : null;
    var fallback = DSP.eqPresetFor(bands);
    return {
      bands: bands,
      labels: labels || fallback.labels,
      centers: centers || fallback.centers,
      rangeDb: (eqSpec && eqSpec.rangeDb > 0) ? eqSpec.rangeDb : fallback.rangeDb,
      stepDb: (eqSpec && eqSpec.stepDb > 0) ? eqSpec.stepDb : fallback.stepDb,
      confidence: eqSpec && eqSpec.confidence,
      usedFallbackCenters: !centers // 标记中心频率是经验兜底，UI 可提示用户
    };
  }
  DSP.normalizeEqSpec = normalizeEqSpec;

  function roundToStep(x, step) {
    if (!(step > 0)) step = 1;
    return Math.round(x / step) * step;
  }
  function round1(x) {
    return Math.round(x * 10) / 10;
  }

  /* ============================================================
   * 5. 规则引擎（数值层，v1 付费功能的核心算法）
   * 依据 REW auto-EQ 思想：
   *   1) 从"与目标差异最大处"开始分配修正量；
   *   2) cut-only：Individual Max Boost = 0，只能衰减峰，不能提升谷；
   *   3) 梳状滤波凹陷（声学干涉）提升无效，必须排除。
   * 输出的 gain 永远 ≤ 0。LLM（v2）只能引用这些数字做文案，不得改数值。
   * ============================================================ */

  /**
   * 梳状滤波检测：谷深 >10dB（dev < -10）且窄（左右相邻 bin 的 dev
   * 比谷底高出 ≥6dB），说明是声学干涉造成的窄凹陷，EQ 提升无效。
   * @param {number[31]} dev31 测量-目标偏差
   * @returns {number[]} comb bin 的下标数组
   */
  DSP.detectComb = function (dev31) {
    var out = [];
    var i;
    for (i = 1; i < 30; i++) {
      if (dev31[i] < -10 &&
          (dev31[i - 1] - dev31[i]) >= 6 &&
          (dev31[i + 1] - dev31[i]) >= 6) {
        out.push(i);
      }
    }
    return out;
  };

  // 某 EQ 段覆盖的 31 段下标：中心 ±0.5 倍频程
  function bandCoverage(centerHz) {
    var lo = centerHz * Math.pow(2, -0.5);
    var hi = centerHz * Math.pow(2, 0.5);
    var idx = [];
    for (var i = 0; i < 31; i++) {
      var f = DSP.ISO31[i];
      if (f >= lo && f <= hi) idx.push(i);
    }
    return idx;
  }

  // 单通道规则计算
  function ruleChannel(meas31, target31, combBins, spec, tol) {
    var dev31 = new Array(31);
    var i;
    for (i = 0; i < 31; i++) dev31[i] = meas31[i] - target31[i];
    var combSet = {};
    for (i = 0; i < combBins.length; i++) combSet[combBins[i]] = true;

    var bands = [];
    var unfixable = [];
    var b;
    for (b = 0; b < spec.bands; b++) {
      var label = spec.labels[b];
      var center = spec.centers[b];
      var cov = bandCoverage(center);
      // 排除梳状滤波 bin：这些凹陷提升无效，不参与 need 计算
      var usable = [];
      var hasComb = false;
      for (i = 0; i < cov.length; i++) {
        if (combSet[cov[i]]) hasComb = true;
        else usable.push(cov[i]);
      }
      var band = { label: label, centerHz: center, gainDb: 0,
                   action: 'none', reason: '' };
      if (usable.length === 0) {
        // 整个覆盖区都是梳状凹陷：保持 0，不做任何提升
        band.action = 'comb';
        band.reason = '该频段存在梳状滤波凹陷（声学干涉所致），EQ 调整无法修正，保持 0 dB';
      } else {
        var maxDev = -Infinity;
        for (i = 0; i < usable.length; i++) {
          if (dev31[usable[i]] > maxDev) maxDev = dev31[usable[i]];
        }
        // REW 思想：只修正"高出目标"的部分，从差异最大处分配
        var need = Math.max(0, maxDev - tol);
        if (need <= 0) {
          band.action = 'none';
          band.reason = '该频段已在目标容差 ±' + tol + ' dB 内，无需调整';
        } else {
          var gain = -roundToStep(need, spec.stepDb);
          if (gain < -spec.rangeDb) gain = -spec.rangeDb;
          if (need > spec.rangeDb) {
            // 需要的衰减量超出车机调节范围：给到最大衰减并如实告知
            band.gainDb = -spec.rangeDb;
            band.action = 'unfixable';
            var remainder = round1(need - spec.rangeDb);
            band.reason = '该频段高于目标约 ' + round1(need) +
              ' dB，超出车机 ±' + spec.rangeDb + ' dB 调节范围；已按最大衰减设置，剩余约 ' +
              remainder + ' dB 无法通过车机 EQ 修正';
            unfixable.push({ label: label, needDb: round1(need),
                             rangeDb: spec.rangeDb, remainderDb: remainder });
          } else {
            band.gainDb = gain;
            band.action = 'cut';
            band.reason = '该频段高于目标约 ' + round1(need) +
              ' dB，衰减 ' + Math.abs(gain) + ' dB 使其贴近目标曲线（仅做衰减，不做提升）';
          }
        }
      }
      if (hasComb && band.action !== 'comb') {
        band.reason += '；注意：该频段内另有梳状滤波凹陷，已排除在计算之外';
      }
      bands.push(band);
    }
    return { bands: bands, unfixable: unfixable, dev31: dev31 };
  }

  // 把各段 gain 映射回 31 段（每 bin 取距其对数最近的段中心之 gain），用于仿真
  function simulate(meas31, target31, bands, spec) {
    var sim31 = new Array(31);
    var i, b;
    for (i = 0; i < 31; i++) {
      var f = DSP.ISO31[i];
      var best = 0, bestDist = Infinity;
      for (b = 0; b < spec.bands; b++) {
        var d = Math.abs(Math.log(f) - Math.log(spec.centers[b]));
        if (d < bestDist) { bestDist = d; best = b; }
      }
      sim31[i] = meas31[i] + bands[best].gainDb;
    }
    var sum = 0;
    for (i = 0; i < 31; i++) sum += Math.abs(sim31[i] - target31[i]);
    return { sim31: sim31, flatness: sum / 31 };
  }

  function meanAbs(dev31) {
    var sum = 0;
    for (var i = 0; i < 31; i++) sum += Math.abs(dev31[i]);
    return sum / 31;
  }

  /**
   * 规则引擎主入口
   * @param {number[31]} measL31 左声道 31 段测量（dB）
   * @param {number[31]} measR31 右声道 31 段测量（dB）
   * @param {object} eqSpec 车机 EQ 规格 {bands, labels, centers|null, rangeDb, stepDb}
   * @param {object} opts {tol} tol 默认 1.5dB
   */
  DSP.ruleEngine = function (measL31, measR31, eqSpec, opts) {
    opts = opts || {};
    var tol = (opts.tol > 0) ? opts.tol : 1.5;
    var spec = normalizeEqSpec(eqSpec);
    var target31 = new Array(31);
    var i;
    for (i = 0; i < 31; i++) target31[i] = DSP.targetDbAt(DSP.ISO31[i]);

    // L/R 独立计算：单点测立体声时左右差异本身就是诊断信息，不可预先平均
    var combL = DSP.detectComb(measL31.map(function (v, k) { return v - target31[k]; }));
    var combR = DSP.detectComb(measR31.map(function (v, k) { return v - target31[k]; }));
    var rL = ruleChannel(measL31, target31, combL, spec, tol);
    var rR = ruleChannel(measR31, target31, combR, spec, tol);

    // 合并：逐段取左右 gain 平均后按步进取整；差异 >1 步进则标注
    var bandsCombined = [];
    var b;
    for (b = 0; b < spec.bands; b++) {
      var gL = rL.bands[b].gainDb, gR = rR.bands[b].gainDb;
      var g = roundToStep((gL + gR) / 2, spec.stepDb);
      if (g < -spec.rangeDb) g = -spec.rangeDb;
      if (g > 0) g = 0; // cut-only 铁律：合并后也永不为正
      var diff = Math.abs(gL - gR) > spec.stepDb + 1e-9;
      var action = rL.bands[b].action;
      // 左右 action 不一致时取更保守的一方（comb/unfixable 优先）
      var order = { comb: 0, unfixable: 1, cut: 2, none: 3 };
      var aR = rR.bands[b].action;
      if (order[aR] < order[action]) action = aR;
      var reason = (action === rL.bands[b].action) ? rL.bands[b].reason : rR.bands[b].reason;
      if (diff && action !== 'comb') {
        reason += '；左右声道该段差异超过 1 档（左 ' + gL + ' / 右 ' + gR +
          ' dB），已取平均，建议以主驾位听感为准微调';
      }
      bandsCombined.push({ label: spec.labels[b], centerHz: spec.centers[b],
                           gainDb: g, action: action, reason: reason,
                           gainL: gL, gainR: gR, lrDiff: diff });
    }

    // 梳状凹陷汇总（供 UI 画标记）
    var combNotches = [];
    function pushNotches(combBins, side) {
      for (var k = 0; k < combBins.length; k++) {
        var idx = combBins[k];
        combNotches.push({ freqHz: DSP.ISO31[idx],
                           depthDb: round1(target31[idx] - (side === 'L' ? measL31[idx] : measR31[idx])),
                           side: side });
      }
    }
    pushNotches(combL, 'L');
    pushNotches(combR, 'R');

    var unfixable = rL.unfixable.concat(rR.unfixable.map(function (u) {
      return { label: u.label + '（右）', needDb: u.needDb,
               rangeDb: u.rangeDb, remainderDb: u.remainderDb };
    }));

    var flatnessBefore = (meanAbs(rL.dev31) + meanAbs(rR.dev31)) / 2;
    var simL = simulate(measL31, target31, rL.bands, spec);
    var simR = simulate(measR31, target31, rR.bands, spec);
    var flatnessAfter = (simL.flatness + simR.flatness) / 2;

    var nAdjust = 0;
    for (b = 0; b < bandsCombined.length; b++) {
      if (bandsCombined[b].gainDb !== 0) nAdjust++;
    }

    return {
      bandsL: rL.bands,
      bandsR: rR.bands,
      bandsCombined: bandsCombined,
      combNotches: combNotches,
      unfixable: unfixable,
      flatnessBefore: round1(flatnessBefore),
      flatnessAfter: round1(flatnessAfter),
      nAdjust: nAdjust,
      tolDb: tol,
      usedFallbackCenters: spec.usedFallbackCenters,
      channelIsolated: !!opts.channelIsolated  // true=L/R 独立测量；false=立体声整体测量
    };
  };

  /* ============================================================
   * 6. 质检：SNR 与测量有效性
   * ============================================================ */

  /**
   * 宽带信噪比（功率比）：10*log10(信号功率/底噪功率)，31 段全频带
   * @returns {{db:number, pass:boolean}} pass = db ≥ 15
   */
  DSP.snr = function (floor31, sig31) {
    var ps = 0, pf = 0;
    for (var i = 0; i < 31; i++) {
      ps += dbToPower(sig31[i]);
      pf += dbToPower(floor31[i]);
    }
    var db = powerToDb(ps / 31) - powerToDb(pf / 31);
    return { db: round1(db), pass: db >= 15 };
  };

  /**
   * 测量有效性检查；任一不过，UI 必须阻止进入下一步（调音方案生成）
   * ① SNR ≥ 15dB；② 100Hz–8kHz 内低于 floor+3dB 的段 ≤5 个；
   * ③ 无纯音干扰（相邻段跳变 <18dB）
   */
  DSP.validityCheck = function (meas31, floor31) {
    var s = DSP.snr(floor31, meas31);
    if (!s.pass) {
      return { ok: false,
               reason: '信噪比仅 ' + s.db + ' dB（要求 ≥15 dB）：信号太弱或环境太吵，请调高音量或换安静环境重测' };
    }
    var weak = 0;
    var i;
    for (i = 0; i < 31; i++) {
      var f = DSP.ISO31[i];
      if (f >= 100 && f <= 8000 && meas31[i] < floor31[i] + 3) weak++;
    }
    if (weak > 5) {
      return { ok: false,
               reason: '100Hz–8kHz 内有 ' + weak + ' 个频段未明显高于底噪（要求 ≤5 个）：粉噪可能未正常播放或麦克风被遮挡' };
    }
    for (i = 1; i < 31; i++) {
      if (Math.abs(meas31[i] - meas31[i - 1]) >= 18) {
        return { ok: false,
                 reason: '在 ' + DSP.ISO31[i] + 'Hz 附近检测到疑似纯音干扰（相邻段跳变 ≥18 dB）：请关闭提示音/来电后重测' };
      }
    }
    return { ok: true, reason: '' };
  };

  /* ============================================================
   * 7. 本地数据层（localStorage，key='cataudio.v1'）
   * schema: {version:1, measurements:[], plans:[]}
   * ============================================================ */
  var LS_KEY = 'cataudio.v1';

  function loadStore() {
    var empty = { version: 1, measurements: [], plans: [] };
    try {
      if (typeof localStorage === 'undefined') return empty;
      var raw = localStorage.getItem(LS_KEY);
      if (!raw) return empty;
      var o = JSON.parse(raw);
      if (!o || typeof o !== 'object') return empty;
      if (!o.measurements) o.measurements = [];
      if (!o.plans) o.plans = [];
      o.version = 1;
      return o;
    } catch (e) {
      return empty;
    }
  }
  function persistStore(o) {
    try {
      if (typeof localStorage === 'undefined') return false;
      localStorage.setItem(LS_KEY, JSON.stringify(o));
      return true;
    } catch (e) {
      return false;
    }
  }
  function makeId(prefix) {
    return prefix + Date.now().toString(36) +
      Math.floor(Math.random() * 0xffffff).toString(36);
  }

  /**
   * 保存一次测量
   * obj: {car:{brand,series,year,huVersion}, eqSpec, floor31, measL31, measR31,
   *       snrDb, sampleRate, ua}
   */
  DSP.saveMeasurement = function (obj) {
    var store = loadStore();
    var m = {
      id: makeId('m'),
      ts: Date.now(),
      car: obj.car || null,
      eqSpec: obj.eqSpec || null,
      floor31: obj.floor31 || null,
      measL31: obj.measL31 || obj.measL || null,
      measR31: obj.measR31 || obj.measR || null,
      channelIsolated: (typeof obj.channelIsolated === 'boolean') ? obj.channelIsolated : null,
      snrDb: (typeof obj.snrDb === 'number') ? obj.snrDb : null,
      sampleRate: obj.sampleRate || null,
      ua: obj.ua || (typeof navigator !== 'undefined' ? navigator.userAgent : '')
    };
    store.measurements.push(m);
    persistStore(store);
    return m.id;
  };

  DSP.listMeasurements = function () {
    return loadStore().measurements;
  };

  /**
   * 保存一次调音方案（规则引擎输出 + 用户确认的最终 EQ）
   * obj: {measurementId, car, eqSpec, engineResult, finalBands, priceTier}
   */
  /**
   * 悬赏计划报名（v1 本地存储；云端报名 v2）
   * 同一车型去重
   */
  DSP.saveBountySignup = function (car) {
    var store = loadStore();
    if (!store.bountySignups) store.bountySignups = [];
    car = car || {};
    store.bountySignups.push({ ts: Date.now(), brand: car.brand || '', series: car.series || '', year: car.year || '' });
    var seen = {}, out = [];
    store.bountySignups.forEach(function (s) {
      var k = s.brand + '|' + s.series + '|' + s.year;
      if (!seen[k]) { seen[k] = 1; out.push(s); }
    });
    store.bountySignups = out;
    return persistStore(store);
  };
  DSP.getBountySignups = function () {
    try { return loadStore().bountySignups || []; } catch (_) { return []; }
  };
  DSP.savePlan = function (obj) {
    var store = loadStore();
    var p = {
      id: makeId('p'),
      ts: Date.now(),
      measurementId: obj.measurementId || null,
      car: obj.car || null,
      eqSpec: obj.eqSpec || null,
      engineResult: obj.engineResult || null,
      finalBands: obj.finalBands || null,
      priceTier: obj.priceTier || null
    };
    store.plans.push(p);
    persistStore(store);
    return p.id;
  };

  /* ============================================================
   * 8. 埋点（v1：控制台输出；v2 接上报通道时只改这一处）
   * ============================================================ */
  DSP.track = function (event, props) {
    try {
      if (typeof console !== 'undefined' && console.log) {
        console.log('[analytics]', event, props || {});
      }
    } catch (e) {}
  };

  /**
   * 公开版 simulate：供报告页"调后效果预览"曲线使用
   * @param {number[31]} meas31 实测 31 段（dB）
   * @param {Array} bands 规则引擎输出的 bands（bandsCombined 或单声道 bands）
   * @param {object} eqSpec 车机 EQ 规格
   * @returns {number[31]} 模拟调后 31 段（dB）
   */
  DSP.simulate = function (meas31, bands, eqSpec) {
    var spec = normalizeEqSpec(eqSpec);
    var target31 = new Array(31);
    for (var i = 0; i < 31; i++) target31[i] = DSP.targetDbAt(DSP.ISO31[i]);
    return simulate(meas31, target31, bands, spec).sim31;
  };

  /* ============================================================
   * 9. v2 接口预留
   * ============================================================ */
  // v2: LLM 只做文案（把规则引擎的数字翻译成用户能懂的语言），
  // 数值永远由 ruleEngine 生成。LLM 层只能引用 ruleEngine 输出里的数字，
  // 不得自行编造、修改任何 gainDb / flatness / needDb。
  DSP.llmHook = null;

  /* ============================================================
   * 导出
   * ============================================================ */
  global.DSP = DSP;
  global.MODELS_DB = MODELS_DB; // 车型库：UI 层（blk2）直接引用，必须挂全局

})(typeof window !== 'undefined' ? window : this);

</script>

<script>
/* =====================================================================
 * 页面逻辑层（UI 壳）
 * 约定：
 *  - 算法只调 window.DSP（规则引擎层 v1）；文案只取 window.COPY。
 *  - LLM 文案层为 v2 预留：未来个性化解读走 DSP.llmHook（此处仅注释提及，不调用）。
 *  - 所有中文注释；iOS Safari 音频初始化必须在用户手势回调链内直接触发。
 * ===================================================================== */
'use strict';

/* ---------- COPY 安全读取：缺 key 降级显示 key 名，不白屏 ---------- */
function t(path){
  var o = window.COPY, parts = String(path).split('.'), i;
  for(i=0;i<parts.length;i++){
    if(o==null) break;
    o = o[parts[i]];
  }
  if(o===undefined || o===null){
    if(window.console) console.warn('[COPY] missing key:', path);
    return path; // 降级：显示 key 名本身
  }
  return o;
}
function tt(path){ // 纯文本 key
  var v = t(path);
  return (typeof v==='string') ? v : String(path);
}
function tf(path){ // 函数型 key，如 report.foundN(n)
  var v = t(path);
  return (typeof v==='function') ? v : function(){ return String(path); };
}
function setText(id, path){
  var el = document.getElementById(id);
  if(el) el.textContent = tt(path);
}

/* ---------- 埋点（经 DSP） ---------- */
function track(ev, data){
  try{ if(window.DSP && DSP.track) DSP.track(ev, data||{}); }catch(_){}
}

/* ---------- 全局状态机 ---------- */
var app = {
  state: { pro:false, car:null, eqSpec:null, floor31:null, measL:null, measR:null, plan:null, paid:false },
  playMode: 'bt',           // 'bt' | 'usb'
  measureMode: 'stereo',      // 'stereo'（默认）| 'lr'（进阶可选项）
  checklist: {},             // key -> 'skip'
  measurer: null,
  runToken: 0,
  lastFrame: null,          // 最新实时帧 {eqLevels, peak, clipped, band31?}
  measuring: false,
  rafId: 0,
  stepStart: 0, stepDur: 0, // 进度计时
  clipStreak: 0,
  lowStreak: 0,
  curStep: -1
};
function S(){ return app.state; }

/* ---------- 路由：section 切换 ---------- */
var CTA = {}; // 各 section 的底部 CTA 配置，init 时装配
var ON_SHOW = {}; // 切到某 section 时的刷新钩子（canvas 需可见后才能取尺寸）
function show(id){
  document.querySelectorAll('.sec').forEach(function(s){ s.classList.remove('active'); });
  var el = document.getElementById('sec-'+id);
  if(el) el.classList.add('active');
  window.scrollTo(0,0);
  // 测量中途切走：让未完成的 measure promise 失效，防止后台回调污染 UI
  var wasMeasuring = app.measuring && !document.getElementById('sec-measure').classList.contains('active');
  stopRaf();
  if(wasMeasuring) app.runToken++;
  renderCTA(CTA[id]||[]);
  if(ON_SHOW[id]){ try{ ON_SHOW[id](); }catch(_){} }
  track('view_'+id);
}
function renderCTA(btns, sub){
  var box = document.getElementById('cta-inner');
  box.innerHTML = '';
  btns.forEach(function(b){
    var btn = document.createElement('button');
    btn.className = 'btn ' + (b.primary===false ? 'btn-ghost' : 'btn-primary');
    btn.textContent = b.text;
    if(b.disabled) btn.disabled = true;
    if(b.id) btn.id = b.id;
    btn.onclick = b.onClick;
    box.appendChild(btn);
  });
  if(typeof sub==='string' && sub){
    var s = document.createElement('div');
    s.className = 'cta-sub'; s.textContent = sub;
    box.appendChild(s);
  }
  // 无 CTA 时隐藏底栏，避免遮挡
  document.getElementById('cta-bar').style.display = btns.length ? '' : 'none';
}

/* rAF 生命周期：测量页才跑，离开页面/切 section 即 cancel */
function stopRaf(){
  if(app.rafId){ cancelAnimationFrame(app.rafId); app.rafId = 0; }
  app.measuring = false;
}
document.addEventListener('visibilitychange', function(){
  if(document.hidden){
    app._paused = app.measuring; // 切后台暂停 rAF，回来恢复
    stopRaf();
  }else if(app._paused){
    app._paused = false;
    startRaf();
  }
});

 * 首页

function initHome(){
  setText('home-badge','home.badgeFree');
  setText('home-title','home.title');

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
}

/* =====================================================================
 * 车型选择（三级联选：品牌→车系→年款，数据源 MODELS_DB）
 * ===================================================================== */
/* 品牌模糊搜索（大小写不敏感，子串匹配） */
/* 归一化：去空格、小写（"吉利 星越L"/"星越 L"/"吉利星越L" 统一命中同一条） */
function normCarText(s){
  return String(s == null ? '' : s).toLowerCase().replace(/\s+/g, '');
}
/**
 * 品牌+车系联合归一化搜索
 * @returns {{brands:Array, series:Array<{b,se}>}} brands:品牌命中；series:车系直达
 */
function carSearch(q){
  var nq = normCarText(q);
  var brands = [], series = [], seenB = {}, i, j;
  var all = MODELS_DB.brands;
  for (i = 0; i < all.length; i++){
    var b = all[i], nb = normCarText(b.name);
    if (!nq || nb.indexOf(nq) !== -1 || nq.indexOf(nb) !== -1){
      if (!seenB[b.name]){ seenB[b.name] = 1; brands.push(b); }
    }
    for (j = 0; j < b.series.length; j++){
      var se = b.series[j];
      var ns = normCarText(se.name), nbs = normCarText(b.name + se.name);
      if (nq && (ns.indexOf(nq) !== -1 || nq.indexOf(ns) !== -1 ||
                 nbs.indexOf(nq) !== -1 || nq.indexOf(nbs) !== -1)){
        series.push({ b: b, se: se });
      }
    }
  }
  return { brands: brands, series: series };
}
/* 由 eq_note 文案推导可信度等级 */
function carConfidenceFromNote(note){
  note = String(note || '');
  if (note.indexOf('用户实') !== -1) return '用户实测';
  if (note.indexOf('媒体实测') !== -1) return 'media实测';
  if (note.indexOf('手册实锤') !== -1) return 'manual手册';
  if (note.indexOf('推断') !== -1) return '推断';
  if (note.indexOf('待确认') !== -1 || note.indexOf('车主实测') !== -1) return 'forum论坛';
  return '推断';
}
/* 已知车系的标签/中心频率/范围覆盖（源自 25 车系调研实锤） */
var CAR_LABEL_OVERRIDES = {
  '吉利|星越L':    { labels: ['重低音','低音','中低音','中音','中高音','高音','超高音'], centers: null, rangeDb: 9, stepDb: 1 },
  '比亚迪|元PLUS': { labels: ['80Hz','500Hz','1kHz','5kHz','16kHz'], centers: [80,500,1000,5000,16000], rangeDb: 9, stepDb: 1 },
  '理想|ONE':      { labels: ['低音','中低音','中音','中高音','高音'], centers: null, rangeDb: 6, stepDb: 1 }
};
/**
 * 由 models.json 车系条目推导 EQ 规格
 * @returns {object|null} 规格对象；null = 无数据，走手动选段数流程
 */
function carSpecFromSeries(brand, se){
  var bands = se.eq_bands;
  if (bands === undefined || bands === null) return null;
  if (bands === 0){
    return { bands: 0, labels: [], centers: [], rangeDb: 0, stepDb: 1,
             confidence: carConfidenceFromNote(se.eq_note), note: se.eq_note || '',
             centersVerified: false };
  }
  var ov = CAR_LABEL_OVERRIDES[brand + '|' + se.name];
  var labels, centers = null, rangeDb = 9, stepDb = 1;
  if (ov){ labels = ov.labels; centers = ov.centers; rangeDb = ov.rangeDb; stepDb = ov.stepDb; }
  else if (bands === 3){ labels = ['低音','中音','高音']; rangeDb = 6; }
  else if (bands === 5 && brand === '比亚迪'){ labels = ['80Hz','500Hz','1kHz','5kHz','16kHz']; centers = [80,500,1000,5000,16000]; }
  else if (bands === 5){ labels = ['低音','中低音','中音','中高音','高音']; }
  else if (bands === 7){ labels = ['重低音','低音','中低音','中音','中高音','高音','超高音']; }
  else if (bands === 8){ labels = ['B1','B2','B3','B4','B5','B6','B7','B8']; centers = [64,250,500,1000,3150,8000]; }
  else { labels = []; for (var i = 0; i < bands; i++) labels.push('B' + (i + 1)); }
  var conf = carConfidenceFromNote(se.eq_note);
  return { bands: bands, labels: labels, centers: centers, rangeDb: rangeDb, stepDb: stepDb,
           confidence: conf, note: se.eq_note || '',
           centersVerified: !!(centers && (conf === '用户实测' || conf === 'media实测')) };
}

/* 由段数取 DSP 预设（置信度=经验预设），多层降级保证不崩 */
function resolvePreset(bands){
  var spec = null;
  try{ if(DSP.eqPresetFor) spec = DSP.eqPresetFor(bands); }catch(_){}
  if(!spec){
    try{
      var P = DSP.EQ_PRESETS;
      if(P){ spec = P[bands] || (P.get && P.get(bands)) || null; }
    }catch(_){}
  }
  if(!spec){
    var labels = {3:['低音','中音','高音'],5:['低音','中低音','中音','中高音','高音'],
                  7:['重低音','低音','中低音','中音','中高音','高音','超高音'],
                  8:['重低音','低音','中低音','中音','中高音','高音','超高音','极高音']}[bands] || null;
    spec = { bands:bands, labels:labels||Array.from({length:bands},function(_,i){return 'B'+(i+1);}),
             centers:null, rangeDb:9, stepDb:1, confidence:'经验预设', note:'' };
  }
  spec.confidence = spec.confidence || '经验预设';
  spec.centersVerified = false; // 手动/预设的中心频率均为经验值，展示时标"待实测"
  return spec;
}
function renderEqSpec(){
  var spec = S().eqSpec, box = document.getElementById('eqspec-panel');
  if(!spec){ box.innerHTML=''; return; }
  if(spec.bands === 0){
    box.innerHTML =

/* =====================================================================
 * 测量页（核心）
 * 流程：①环境底噪 30s → ②立体声整体测量 30s（默认）；进阶可解锁 L/R 各 30s
 * 实时柱按车机 EQ 段数绘制（非 31 段 hero）；专业模式额外叠加内部 31 段。
 * iOS Safari：Measurer.init 必须由按钮 onclick 直接调用，async 链不断开。
 * ---------------------------------------------------------------------
 * 时长原理（v1.8）：粉噪是随机信号，1/3 倍频程测量的理论波动 ε ≈ 1/√(带宽×时间)，
 * 瓶颈在低频。30s 时：20Hz（带宽 4.6Hz）±0.7dB，50Hz 以上全 <0.5dB——真正的
 * 专业级 1/3 倍频程精度。两步共 60 秒，坐车里 1 分钟做一次调音，体验可接受。
 * 车机 EQ 步进 1dB，测量波动必须压到 1dB 内才有意义；8s 技术上"够用"但用户

 * ===================================================================== */
/* 原理备注：车机 DSP 会对蓝牙/USB 输入做混音/上混，单声道信号无法隔离到单侧喇叭——

/* canvas 尺寸适配 dpr */
function fitCanvas(cv, h){
  var dpr = window.devicePixelRatio||1;
  var w = cv.clientWidth || cv.parentElement.clientWidth || 320;
  cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
  var ctx = cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx:ctx, w:w, h:h};
}
var barsGeom=null, bars31Geom=null;
function sizeCanvases(){
  barsGeom = fitCanvas(document.getElementById('bars'), 190);
  bars31Geom = fitCanvas(document.getElementById('bars31'), 64);
}
/* 颜色：电平低→青，高→橙 */
function levelColor(frac){
  // frac 0..1
  var c1=[34,211,238], c2=[255,159,28];
  var r=Math.round(c1[0]+(c2[0]-c1[0])*frac), g=Math.round(c1[1]+(c2[1]-c1[1])*frac), b=Math.round(c1[2]+(c2[2]-c1[2])*frac);
  return 'rgb('+r+','+g+','+b+')';
}
function drawBars(){
  var g = barsGeom; if(!g) return;
  var ctx = g.ctx, W=g.w, H=g.h;
  ctx.clearRect(0,0,W,H);
  var spec = S().eqSpec, n = spec?spec.bands:0;
  var lv = (app.lastFrame && app.lastFrame.eqLevels) || [];
  if(!n){ return; }
  var pad=8, gap=6, bw=(W-pad*2-gap*(n-1))/n;
  var DB_MIN=-60, DB_MAX=0;
  for(var i=0;i<n;i++){
    var db = (typeof lv[i]==='number')?lv[i]:DB_MIN;
    var frac = Math.max(0, Math.min(1, (db-DB_MIN)/(DB_MAX-DB_MIN)));
    var bh = frac*(H-34);
    var x = pad+i*(bw+gap), y = H-16-bh;
    var grad = ctx.createLinearGradient(0,H-16,0,y);
    var col = levelColor(frac);
    grad.addColorStop(0,'rgba(34,211,238,.25)'); grad.addColorStop(1,col);
    ctx.fillStyle = grad;
    var r = Math.min(4, bw/2);
    ctx.beginPath();
    ctx.moveTo(x, y+r); ctx.arcTo(x,y,x+r,y,r); ctx.arcTo(x+bw,y,x+bw,y+r,r);
    ctx.lineTo(x+bw, H-16); ctx.lineTo(x, H-16); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#8B94A3'; ctx.font = '10px -apple-system,sans-serif'; ctx.textAlign='center';
    ctx.fillText(Math.round(db)+'dB', x+bw/2, Math.max(10, y-4));
  }
}
function drawBars31(){
  var g = bars31Geom; if(!g) return;
  var ctx=g.ctx, W=g.w, H=g.h;
  ctx.clearRect(0,0,W,H);
  var b31 = (app.lastFrame && app.lastFrame.band31) || [];
  var n=31, bw=W/n;
  for(var i=0;i<n;i++){
    var db = (typeof b31[i]==='number')?b31[i]:-60;
    var frac = Math.max(0, Math.min(1,(db+60)/60));
    var bh = frac*(H-6);
    ctx.fillStyle = levelColor(frac);
    ctx.fillRect(i*bw+1, H-bh, Math.max(1,bw-2), bh);
  }
}
/* rAF 主循环：只在测量进行中运行 */
function rafLoop(){
  if(!app.measuring) return;
  drawBars();
  if(S().pro) drawBars31();
  // 进度
  if(app.stepDur>0){
    var p = Math.min(1, (performance.now()-app.stepStart)/(app.stepDur*1000));
    var bar = document.getElementById('step-p-'+app.curStep);
    if(bar) bar.style.width = (p*100).toFixed(1)+'%';
    // 专业反馈：让用户"看到"时间花在哪，而不是干等倒计时
    var remain = app.stepDur - (performance.now()-app.stepStart)/1000;
    if(remain<=5 && remain>0 && !app.avgShown){
      app.avgShown = true; // 结束前 5 秒：最终平均
      setStatus(tt('measure.finalAvg'));
    }else if(!app.avgShown && app.frameCount>0 && app.frameCount!==app._shownFrames){
      app._shownFrames = app.frameCount; // 采集进行时：帧计数器（节流到变化才刷新）
      setStatus(tf('measure.collectingN')(app.frameCount));
    }
  }
  // 电平表
  var f = app.lastFrame;
  if(f && typeof f.peak==='number'){
    var pdb = 20*Math.log10(Math.max(1e-6, f.peak));
    var frac = Math.max(0, Math.min(1,(pdb+60)/60));
    document.getElementById('levelfill').style.width = (frac*100).toFixed(1)+'%';
    document.getElementById('leveldb').textContent = pdb.toFixed(1)+' dBFS';
  }
  app.rafId = requestAnimationFrame(rafLoop);
}
function startRaf(){ stopRaf(); app.measuring = true; app.rafId = requestAnimationFrame(rafLoop); }

/* 实时帧回调：DSP.Measurer 透出 {eqLevels, peak, clipped} */
function onFrame(f){
  app.frameCount = (app.frameCount||0)+1; // 专业反馈：采集帧计数
  var spec = S().eqSpec;
  var eqLevels = f.eqLevels;
  if(!eqLevels && f.band31 && spec && spec.bands){
    try{ eqLevels = DSP.eqBandLevels(spec, f.band31); }catch(_){ eqLevels = []; }
  }
  app.lastFrame = { eqLevels:eqLevels||[], peak:f.peak, clipped:!!f.clipped, band31:f.band31||null };
  // 削顶：连续 5 帧触发红字报警并自动停止
  if(f.clipped){ app.clipStreak++; } else { app.clipStreak = 0; }
  if(app.clipStreak>=5){ onClipStop(); return; }
  // 电平过低提示
  if(typeof f.peak==='number' && f.peak < Math.pow(10,-45/20)){ app.lowStreak++; } else { app.lowStreak=0; }
  var lowEl = document.getElementById('snr-alert');
  if(app.lowStreak>30 && !lowEl.classList.contains('show')){
    lowEl.textContent = tt('measure.levelLow'); lowEl.classList.add('show');
  }
}
function onClipStop(){
  var token = ++app.runToken; // 让未完成的 measure promise 失效
  stopRaf();
  app.measuring = false;
  try{ if(app.measurer){ if(app.measurer.abort) app.measurer.abort(); if(app.measurer.stopPink) app.measurer.stopPink(); } }catch(_){}
  document.getElementById('clip-alert').classList.add('show');
  setStatus(tt('measure.clipAlert'));
  resetStepsUI();
  CTA.measure = [{ text: tt('measure.ctaStart'), onClick: startMeasureFlow }];
  renderCTA(CTA.measure, tt('measure.ctaSub'));
  track('measure_clip_stop');
}
function setStatus(s){ document.getElementById('measure-status').textContent = s; }
function setStepState(i, cls){
  var d = document.getElementById('step-'+i);
  if(d) d.className = 'step '+cls;
}
function resetStepsUI(){

}
function hideAlerts(){

}

/* 声道隔离自检弹窗：Promise<boolean|null>（true=隔离ok / false=混音 / null=中止） */
function askChannelIsolation(){
  return new Promise(function(resolve){
    var ov = document.createElement('div');
    ov.className = 'iso-overlay';
    ov.innerHTML =
      '<div class="iso-card">'+
        '<div class="h" style="font-size:17px;">'+escapeHtml(tt('measure.isoCheckTitle'))+'</div>'+
        '<div class="small mt8">'+escapeHtml(tt('measure.isoCheckQ'))+'</div>'+
        '<button class="btn btn-primary" id="iso-yes">'+escapeHtml(tt('measure.isoYes'))+'</button>'+
        '<button class="btn btn-ghost" id="iso-no">'+escapeHtml(tt('measure.isoNo'))+'</button>'+
      '</div>';
    document.body.appendChild(ov);
    var done = false;
    function finish(v){ if(done) return; done = true; try{ document.body.removeChild(ov); }catch(_){} resolve(v); }
    // iOS 防吞点击：click + touchend 双通道（与 bindTap 同策略，内联自包含）
    function wire(id, val){
      var el = document.getElementById(id), fired = 0;
      function go(e){ var n = Date.now(); if(n - fired < 600) return; fired = n; finish(val); }
      el.addEventListener('click', go);
      var sx = 0, sy = 0;
      el.addEventListener('touchstart', function(e){ var tc = e.touches[0]; sx = tc.clientX; sy = tc.clientY; }, {passive:true});
      el.addEventListener('touchend', function(e){
        var tc = e.changedTouches[0];
        if(Math.abs(tc.clientX - sx) < 12 && Math.abs(tc.clientY - sy) < 12){
          if(e.cancelable) e.preventDefault();
          go(e);
        }
      });
    }
    wire('iso-yes', true);
    wire('iso-no', false);
    // 对外暴露取消入口（流程中止时用）
    ov._cancel = function(){ finish(null); };
    app._isoOverlay = ov;
  });
}
function closeIsoOverlay(){
  try{ if(app._isoOverlay && app._isoOverlay._cancel) app._isoOverlay._cancel(); }catch(_){}
  app._isoOverlay = null;
}
/* 有效性门：不过则亮红字+回重试，不再继续 */
function validityGate(meas, chLabel){
  var vok = true, vreason='';
  try{
    var v = DSP.validityCheck(meas, S().floor31);
    if(v===false){ vok=false; }
    else if(v && typeof v==='object'){ vok = v.ok!==false; vreason = v.reason||''; }
  }catch(e){ vok=true; }
  if(!vok){
    var va = document.getElementById('valid-alert');
    va.textContent = tt('measure.validityFail') + (vreason?('：'+vreason):'');
    va.classList.add('show');
    track('measure_validity_fail', {ch:chLabel, reason:vreason});
    CTA.measure = [{ text: tt('common.retry'), onClick: startMeasureFlow }];
    renderCTA(CTA.measure);
    return false;
  }
  return true;
}
/* SNR 告警（<15dB 提示调大音量，不阻断；注：DSP.snr 签名为 (floor31, sig31)） */
function snrGate(meas, chLabel){
  try{
    var s = DSP.snr(S().floor31, meas);
    if(s && typeof s.db==='number' && s.pass===false){
      var sa = document.getElementById('snr-alert');
      sa.textContent = tt('measure.snrWarn') + '（' + s.db + ' dB）';
      sa.classList.add('show');
      track('measure_low_snr', {ch:chLabel, snr:s.db});
    }
  }catch(_){}
}
/* 测量主流程：由按钮 onclick 直接调用（iOS 手势链） */
async function startMeasureFlow(){
  hideAlerts();
  document.getElementById('mic-err-card').classList.add('hidden');
  resetStepsUI();
  var token = ++app.runToken;
  var spec = S().eqSpec;
  // ① 初始化（必须在手势回调链内同步触发）
  var M;
  try{
    M = new DSP.Measurer();
    await M.init();            // ← iOS：getUserMedia / AudioContext 在此完成
  }catch(e){
    document.getElementById('mic-err-card').classList.remove('hidden');
    document.getElementById('mic-err-title').textContent = ttx('measure.micErrTitle','measure.validityFail');
    document.getElementById('mic-err-body').textContent = ttx('measure.micErrBody','measure.safeNote');
    track('measure_mic_denied');
    return;
  }
  if(token!==app.runToken) return;
  app.measurer = M;
  try{ M.setEqSpec(spec); }catch(_){}
  track('measure_start', {mode:app.playMode, bands:spec?spec.bands:0});
  CTA.measure = [{ text: tt('measure.measuringTip'), disabled:true, onClick:function(){} }];
  renderCTA(CTA.measure);

  // ② 环境底噪 30s
  setStepState(0,'active'); setStatus(tt('measure.stepFloor'));
  app.curStep=0; app.stepStart=performance.now(); app.stepDur=30;
  app.frameCount=0; app.avgShown=false; app._shownFrames=-1;
  startRaf();
  var floor31 = null;
  try{ floor31 = await M.startFloor(); }catch(e){ return failMeasure(token, e); }
  if(token!==app.runToken) return;
  S().floor31 = floor31;
  setStepState(0,'done'); track('floor_done');

  // ③ 立体声整体测量 30s（默认流程：dual-mono，一次测完；测的就是驾驶位实际听到的声音）
  app.measureMode = 'stereo'; buildStepsUI();
  setStepState(1,'active'); setStatus(tt('measure.stepStereo'));
  app.curStep=1; app.stepStart=performance.now(); app.stepDur=30; app.clipStreak=0; app.lowStreak=0;
  app.frameCount=0; app.avgShown=false; app._shownFrames=-1;
  startRaf();
  if(app.playMode==='bt'){ try{ M.playPink(null); }catch(_){} }  // dual-mono：左右同发
  var meas = null;
  try{ meas = await M.measure(30, onFrame); }catch(e){ return failMeasure(token, e); }
  if(app.playMode==='bt'){ try{ M.stopPink(); }catch(_){} }
  if(token!==app.runToken) return; // 削顶自动停止后丢弃
  stopRaf(); app.measuring=false;
  if(!validityGate(meas, 'stereo')) return;
  snrGate(meas, 'stereo');
  S().measL = meas; S().measR = meas;
  S().channelIsolated = false;
  setStepState(1,'done');
  // 持久化（经 DSP）
  try{ DSP.saveMeasurement({ car:S().car, eqSpec:S().eqSpec, floor31:floor31, measL:meas, measR:meas, channelIsolated:false, mode:app.playMode, ts:Date.now() }); }catch(_){}
  setStatus('');
  track('measure_done', {flow:'stereo'});
  renderCTA(CTA['measure_done']);
}

/* 进阶：声道隔离自检 → 解锁 L/R 独立测量（DSP/外接播放器用户）。
   车机 DSP 会对蓝牙/USB 输入混音/上混，大多数车机过不了自检——这是硬件链路限制。 */
async function startLrOptIn(){
  var token = ++app.runToken;
  var M = app.measurer;
  if(!M){
    setStatus(tt('measure.advNeedRemeasure'));
    track('lr_optin_no_measurer');
    return;
  }
  hideAlerts();
  app.measureMode = 'lr'; buildStepsUI(); resetStepsUI();
  setStepState(0,'done'); // 底噪已测过，不重测
  track('lr_optin_start');

  // 自检：播 3s 左声道粉噪
  setStatus(tt('measure.isoCheckTitle')+'…');
  if(app.playMode==='bt'){ try{ M.playPink('L'); }catch(_){} }
  await new Promise(function(r){ setTimeout(r, 3000); });
  if(token!==app.runToken) return;
  if(app.playMode==='bt'){ try{ M.stopPink(); }catch(_){} }
  var ans = await askChannelIsolation();
  if(token!==app.runToken) return;
  if(ans!==true){
    // 未通过：回整体模式 + 诚实提示
    app.measureMode = 'stereo'; buildStepsUI(); resetStepsUI();
    setStepState(0,'done'); setStepState(1,'done');
    var ma = document.getElementById('mix-alert');
    ma.textContent = tt('measure.mixAlert'); ma.classList.add('show');
    setStatus('');
    track('lr_optin_iso_fail');
    renderCTA(CTA['measure_done']);
    return;
  }
  track('lr_optin_iso_pass');
  // L/R 各 30s
  var results = {};
  var defs = stepDefs();
  for(var s=1;s<=2;s++){
    var ch = s===1?'L':'R';
    setStepState(s,'active'); setStatus(tt(defs[s].copy));
    app.curStep=s; app.stepStart=performance.now(); app.stepDur=30; app.clipStreak=0; app.lowStreak=0;
    app.frameCount=0; app.avgShown=false; app._shownFrames=-1;
    startRaf();
    if(app.playMode==='bt'){ try{ M.playPink(ch); }catch(_){} }
    var m2 = null;
    try{ m2 = await M.measure(30, onFrame); }catch(e){ return failMeasure(token, e); }
    if(app.playMode==='bt'){ try{ M.stopPink(); }catch(_){} }
    if(token!==app.runToken) return;
    stopRaf(); app.measuring=false;
    if(!validityGate(m2, ch)) return;
    snrGate(m2, ch);
    results[ch]=m2;
    setStepState(s,'done');
    track(s===1?'measure_l_done':'measure_r_done');
  }
  S().measL = results.L; S().measR = results.R;
  S().channelIsolated = true;
  try{ DSP.saveMeasurement({ car:S().car, eqSpec:S().eqSpec, floor31:S().floor31, measL:results.L, measR:results.R, channelIsolated:true, mode:app.playMode, ts:Date.now() }); }catch(_){}
  setStatus('');
  track('measure_done', {flow:'lr'});
  renderCTA(CTA['measure_done']);
}
function failMeasure(token, e){
  if(token!==app.runToken) return;
  stopRaf(); app.measuring=false;
  var va = document.getElementById('valid-alert');
  va.textContent = tt('measure.validityFail');
  va.classList.add('show');
  CTA.measure = [{ text: tt('common.retry'), onClick: startMeasureFlow }];
  renderCTA(CTA.measure);
  track('measure_error', {msg:String(e&&e.message||e)});
}

/* =====================================================================
 * 免费报告
 * ===================================================================== */
function avg31(){
  var L=S().measL, R=S().measR;
  var a = (L&&L.band31)||L||[], b=(R&&R.band31)||R||[];
  var n = Math.max(a.length,b.length,31), out=[];
  for(var i=0;i<n;i++){
    var x = (typeof a[i]==='number')?a[i]:0, y=(typeof b[i]==='number')?b[i]:0;
    out.push((x+y)/2);
  }
  return out;
}
/* 规则引擎层（v1）：数值方案由 DSP.ruleEngine 产生；LLM 文案层为 v2 预留 */
function buildPlan(){
  return DSP.ruleEngine(S().measL, S().measR, S().eqSpec, { channelIsolated: S().channelIsolated });
}
function renderReport(){
  setText('report-title','report.title');
  setText('report-preview-title','report.previewTitle');
  setText('report-trust','report.trustNote');
  setText('report-priceline','report.priceLine');
  setText('bk-report','common.back');
  // 发现 N 处需调整
  var n = 0;
  try{
    var prev = buildPlan();
    S()._planDraft = prev;
    var bands = prev.bands||prev||[];
    n = bands.filter(function(bd){ return Math.abs(bd.gainDb||0)>=1 || bd.comb || bd.unfixable; }).length;
  }catch(e){ n = 0; }
  document.getElementById('report-found').textContent = tf('report.foundN')(n);
  // 图例
  var lg = document.getElementById('report-legend');
  lg.innerHTML =
    '<span><i style="background:#22D3EE"></i>'+escapeHtml(tt('report.legendMeas'))+'</span>'+
    '<span><i style="background:#FF9F1C"></i>'+escapeHtml(tt('report.legendTarget'))+'</span>'+
    '<span><i style="background:#34D399"></i>'+escapeHtml(tt('report.legendSim'))+'</span>';
  ON_SHOW.report = function(){ drawReportChart(); }; // 可见后重绘，保证 canvas 尺寸正确
  track('report_view', {issues:n});
  CTA.report = [{ text: tt('report.ctaUnlock'), onClick: function(){ track('report_unlock_click'); show('consent'); } }];
  renderCTA(CTA.report);
}
function drawReportChart(){
  var cv = document.getElementById('report-chart');
  var g = fitCanvas(cv, 220), ctx=g.ctx, W=g.w, H=g.h;
  ctx.clearRect(0,0,W,H);
  var iso = DSP.ISO31 || [];
  var meas = avg31();
  var tgt = iso.map(function(f){ try{ return DSP.targetDbAt(f); }catch(_){ return 0; } });
  var sim = meas.slice();
  try{
    var draft = S()._planDraft || buildPlan();
    var gains = (draft.bands||[]).map(function(bd){ return bd.gainDb||0; });
    sim = DSP.simulate(meas, gains) || meas;
  }catch(_){}
  var all = meas.concat(tgt, sim);
  var mn=Math.min.apply(null,all)-2, mx=Math.max.apply(null,all)+2;
  function X(f){ var l0=Math.log10(20), l1=Math.log10(20000); return 34+(Math.log10(f)-l0)/(l1-l0)*(W-44); }
  function Y(db){ return 14+(1-(db-mn)/(mx-mn))*(H-38); }
  // 网格
  ctx.strokeStyle='rgba(255,255,255,.06)'; ctx.lineWidth=1;
  [20,50,100,200,500,1000,2000,5000,10000,20000].forEach(function(f){
    ctx.beginPath(); ctx.moveTo(X(f),14); ctx.lineTo(X(f),H-24); ctx.stroke();
    ctx.fillStyle='#5b6472'; ctx.font='9px sans-serif'; ctx.textAlign='center';
    ctx.fillText(f>=1000?(f/1000)+'k':f, X(f), H-10);
  });
  function line(arr, color, width){
    ctx.strokeStyle=color; ctx.lineWidth=width; ctx.beginPath();
    for(var i=0;i<iso.length && i<arr.length;i++){
      var x=X(iso[i]), y=Y(arr[i]);
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  line(tgt,'#FF9F1C',2);   // 目标曲线
  line(meas,'#22D3EE',2);  // 实测均值
  line(sim,'#34D399',1.5); // 模拟调后
}

 * 方案页
 * ===================================================================== */
function renderPlan(){
  setText('bk-plan','common.back');
  var spec = S().eqSpec;
  var isET9 = !spec || spec.bands===0;
  document.getElementById('plan-normal').classList.toggle('hidden', isET9);
  document.getElementById('plan-et9').classList.toggle('hidden', !isET9);
  if(isET9){
    setText('plan-et9t','plan.et9Title');
    setText('plan-et9b','plan.et9Body');
    CTA.plan = [{ text: tt('plan.doneBtn'), onClick:function(){ show('home'); } }];
    renderCTA(CTA.plan);
    track('plan_view_et9');
    return;
  }
  setText('plan-title','plan.title');
  setText('plan-sub','plan.sub');
  (function(){
    var el = document.getElementById('plan-perband');
    if(el && spec) el.textContent = tt('plan.perBandNote').split('{n}').join(spec.bands);
  })();
  setText('plan-burnt','plan.burnTitle');
  setText('plan-burnb','plan.burnBody');
  setText('plan-restoret','plan.restoreTitle');
  setText('plan-avgnote','plan.avgNote');
  var rs = t('plan.restoreSteps');
  var rul = document.getElementById('plan-restoresteps'); rul.innerHTML='';
  (Array.isArray(rs)?rs:[]).forEach(function(s){ var li=document.createElement('li'); li.textContent=s; rul.appendChild(li); });

  var plan = S()._planDraft;
  if(!plan){ try{ plan = buildPlan(); S()._planDraft = plan; }catch(e){ plan={bands:[]}; } }
  S().plan = plan;
  var bands = plan.bands||[];
  // 梳状谷检测（规则引擎层 v1 标注）
  var combIdx = [];
  try{ combIdx = DSP.detectComb(avg31()) || []; }catch(_){}
  var box = document.getElementById('plan-bands'); box.innerHTML='';
  bands.forEach(function(bd, i){
    var card = document.createElement('div');
    var isComb = !!bd.comb || combIdx.indexOf(i)>=0;
    card.className = 'gaincard' + (isComb?' comb':'') + ((bd.gainDb||0)>0.5?' boost':'');
    // 中心频率未知时显示"经验预设"
    var centerTxt = (spec.centersVerified && bd.centerHz!=null) ? (bd.centerHz+' Hz') : tt('car.centersPending');
    var gv = (bd.gainDb>0?'+':'') + (bd.gainDb||0) + 'dB';
    var unfix = '';
    if(bd.unfixable){
      unfix = '<div class="gc" style="color:var(--amber);">需要 '+(bd.unfixable.needDb||bd.unfixable.need)+
              '，车机只能到 '+(bd.unfixable.maxDb||bd.unfixable.max)+'（如实告知：此段无法完全修正）</div>';
    }
    card.innerHTML =
      '<div class="gl"><div class="gt">'+escapeHtml(bd.label||('B'+(i+1)))+
        (isComb?' <span class="tag" style="color:var(--red);border-color:rgba(255,77,77,.5);">梳状谷</span>':'')+'</div>'+
        '<div class="gc num">'+escapeHtml(centerTxt)+(bd.action?' · '+escapeHtml(String(bd.action)):'')+'</div>'+
        (isComb?'<div class="gc" style="color:var(--red);">'+escapeHtml(tt('plan.combNote'))+'</div>':'')+
        unfix+'</div>'+
      '<div class="gv num">'+escapeHtml(gv)+'</div>';
    box.appendChild(card);
  });
  try{ DSP.savePlan(plan); }catch(_){}
  track('plan_view', {bands:bands.length});
  CTA.plan = [
    { text: tt('plan.saveCardBtn'), primary:false, onClick: saveShareCard },
    { text: tt('plan.doneBtn'), onClick:function(){ show('home'); } }
  ];
  renderCTA(CTA.plan);
}
/* 保存成绩单：生成分享卡片 DOM + 复制分享文案（禁诱导话术，文案走 COPY） */
function saveShareCard(){
  var card = document.getElementById('share-card');
  var car = S().car, carName = car ? [car.brand,car.series,car.year].filter(Boolean).join(' ') : '';
  var plan = S().plan||{bands:[]};
  var gains = (plan.bands||[]).map(function(bd){ return (bd.label||'')+((bd.gainDb>0?'+':'')+(bd.gainDb||0)+'dB'); }).join(' · ');
  var d = new Date();
  var dateStr = d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
  card.innerHTML =
    '<div class="st">调音成绩单</div>'+
    '<div class="small mt8">'+escapeHtml(carName)+' · '+dateStr+'</div>'+
    '<div class="small mt8 num" style="color:var(--cyan);">'+escapeHtml(gains)+'</div>'+
    '<div class="small mt8" style="color:var(--sub);">'+escapeHtml(tt('report.trustNote'))+'</div>';
  card.classList.remove('hidden');
  var txt = tf('plan.shareCopyText')({car:carName, date:dateStr, gains:gains});
  var done = function(ok){
    track('plan_share_copy', {ok:!!ok});
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(String(txt)).then(function(){done(true);}, function(){done(false);});
  }else{
    var ta=document.createElement('textarea'); ta.value=String(txt); document.body.appendChild(ta);
    ta.select(); try{ document.execCommand('copy'); done(true); }catch(_){ done(false); }
    document.body.removeChild(ta);
  }
}
